<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake - A NIST SP 800-53 Game from CyberRMF</title>
  <meta name="description" content="Eat the controls: a quick NIST SP 800-53 snake game from CyberRMF. Arrow keys, WASD or the D-pad: left and right turn, up jumps, down digs.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --bg:     #1a1d23;
      --bg2:    #23272e;
      --bg3:    #252830;
      --border: #3a3f4b;
      --text:   #e4e6eb;
      --muted:  #9ca3af;
      --dim:    #6b7280;
      --accent: #60a5fa;
      --mono:   'Consolas', 'Fira Code', 'SF Mono', 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { touch-action: manipulation; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; text-decoration: none; }

    .top-bar {
      width: 100%;
      max-width: 720px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-link {
      font-size: 12px;
      color: var(--muted);
      transition: color .2s;
    }
    .back-link:hover { color: var(--text); }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      padding: 0 12px;
      flex: 1;
    }
    .game-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .game-sub {
      font-size: 11px;
      color: var(--dim);
      margin-top: 2px;
      -webkit-font-smoothing: antialiased;
    }
    .flash-area {
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 6px 0;
    }
    .flash-id {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      opacity: 0;
      transition: opacity .15s;
      -webkit-font-smoothing: antialiased;
    }
    .flash-name {
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      transition: opacity .15s;
      -webkit-font-smoothing: antialiased;
    }
    .flash-id.show, .flash-name.show { opacity: 1; }

    .canvas-wrap {
      width: 100%;
      position: relative;
    }
    #snake-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .score {
      font-size: 13px;
      color: var(--muted);
      -webkit-font-smoothing: antialiased;
    }
    .score strong { color: var(--accent); }
    .btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 24px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      transition: border-color .2s;
      -webkit-font-smoothing: antialiased;
    }
    .btn:hover { border-color: var(--muted); }

    /* ── Game Tabs ── */
    .game-tabs {
      display: flex;
      gap: 0;
      margin: 8px 0 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .game-tab {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 18px;
      background: transparent;
      border: none;
      color: var(--dim);
      cursor: pointer;
      transition: color .2s, background .2s;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    .game-tab:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: var(--border);
    }
    .game-tab:hover { color: var(--muted); }
    .game-tab.active {
      color: var(--accent);
      background: rgba(96,165,250,0.08);
    }
    .canvas-wrap.cyber #snake-canvas {
      border-color: rgba(0,229,255,0.45);
      box-shadow: 0 0 16px rgba(0,229,255,0.18);
    }
    .tab-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── D-pad ── */
    .dpad {
      display: none;
      width: 180px;
      height: 180px;
      position: relative;
      margin: 12px auto 20px;
      flex-shrink: 0;
    }
    .dpad-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background .1s, border-color .1s;
      touch-action: manipulation;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      background: rgba(96,165,250,0.15);
      border-color: var(--accent);
    }
    .dpad-btn svg {
      width: 22px;
      height: 22px;
      fill: var(--muted);
      transition: fill .1s;
    }
    .dpad-btn:active svg, .dpad-btn.pressed svg { fill: var(--accent); }
    .dpad-up    { top: 0;   left: 50%; transform: translateX(-50%); }
    .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dpad-left  { left: 0;  top: 50%;  transform: translateY(-50%); }
    .dpad-right { right: 0; top: 50%;  transform: translateY(-50%); }
    @media (max-width: 600px), (pointer: coarse) {
      .dpad { display: block; }
      .game-sub { font-size: 10px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="https://integratermf.com" class="back-link">&larr; Back to site</a>
  </div>

  <div class="game-wrap">
    <div style="text-align:center">
      <div class="game-title">NIST SP 800-53 Snake</div>
      <div class="game-sub" id="game-sub">Eat the controls. Left and right turn, up jumps, hold down to dig: arrow keys, WASD, or D-pad.</div>
    </div>
    <div class="tab-row">
      <div class="game-tabs">
        <button class="game-tab active" id="tab-controls" onclick="switchMode('controls')">800-53 Controls</button>
        <button class="game-tab" id="tab-ports" onclick="switchMode('ports')">Ports &amp; Protocols</button>
      </div>
      <div class="game-tabs">
        <button class="game-tab active" id="theme-classic" onclick="switchTheme('classic')">Classic</button>
        <button class="game-tab" id="theme-cyber" onclick="switchTheme('cyber')">Cybernetic</button>
      </div>
    </div>
    <div class="flash-area">
      <span class="flash-id" id="flash-id"></span>
      <span class="flash-name" id="flash-name"></span>
    </div>
    <div class="canvas-wrap">
      <canvas id="snake-canvas"></canvas>
    </div>
    <div class="hud">
      <span class="score">Score: <strong id="snake-score">0</strong></span>
      <span class="score"><span id="hud-label">Control</span>: <strong id="snake-ctrl">-</strong></span>
      <button class="btn" id="snake-start">Start</button>
    </div>

    <div class="dpad" id="dpad">
      <div class="dpad-btn dpad-up" data-dir="up">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
      </div>
      <div class="dpad-btn dpad-down" data-dir="down">
        <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>
      </div>
      <div class="dpad-btn dpad-left" data-dir="left">
        <svg viewBox="0 0 24 24"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
      </div>
      <div class="dpad-btn dpad-right" data-dir="right">
        <svg viewBox="0 0 24 24"><path d="M20 12l-8 8v-5H4v-6h8V4z"/></svg>
      </div>
    </div>
  </div>

  <script>
window.addEventListener('DOMContentLoaded', function () {

  if (!canvas || !startBtn) return;

    var wrap = canvas.parentElement;

    var aspect = BASE_W / BASE_H;
    var drawW = cw;
    var drawH = Math.round(cw / aspect);
    canvas.style.width = drawW + 'px';
    canvas.style.height = drawH + 'px';
    canvas.width = Math.round(drawW * dpr);
    canvas.height = Math.round(drawH * dpr);
  }
  sizeCanvas();
  window.addEventListener('resize', function () { sizeCanvas(); });

  function S() { return canvas.width / BASE_W; }

  var PORTS = [
    ['7','ECHO'],['19','CHARGEN'],['20','FTP-Data'],['21','FTP'],['22','SSH'],
    ['23','Telnet'],['25','SMTP'],['42','WINS Replication'],['43','WHOIS'],['53','DNS'],
    ['66','Oracle SQL*Net'],['67','DHCP/BOOTP Server'],['68','DHCP/BOOTP Client'],
    ['69','TFTP'],['70','Gopher'],['79','Finger'],['80','HTTP'],['88','Kerberos'],
    ['110','POP3'],['111','SunRPC / Portmap'],['113','IDENT / Auth'],['119','NNTP'],
    ['123','NTP'],['135','MSRPC / EPMAP'],['137','NetBIOS Name Service'],
    ['138','NetBIOS Datagram'],['139','NetBIOS Session / SMB'],['143','IMAP'],
    ['161','SNMP'],['162','SNMP Trap'],['177','XDMCP'],['179','BGP'],['194','IRC'],
    ['201','AppleTalk'],['264','BGMP'],['318','TSP'],['381','HP OpenView NNM'],
    ['383','HP OpenView Data'],['389','LDAP'],['411','Direct Connect Hub'],
    ['412','Direct Connect C2S'],['427','SLP'],['443','HTTPS'],['445','SMB / CIFS'],
    ['464','Kerberos Change/Set Password'],['465','SMTPS'],['497','Retrospect'],
    ['500','ISAKMP / IKE'],['512','Rexec'],['513','Rlogin'],['514','RSH / Syslog'],
    ['515','LPD / Line Printer'],['520','RIP'],['521','RIPng'],['540','UUCP'],

    ['593','DCOM / HTTP RPC'],['631','IPP / CUPS'],['636','LDAPS'],['639','MSDP'],

    ['902','VMware Server'],['989','FTPS Data'],['990','FTPS Control'],
    ['993','IMAPS'],['995','POP3S']
  ];

  var gameMode = 'controls';
  function activeData() { return gameMode === 'controls' ? CONTROLS : PORTS; }

  var ctrlIdx = 0;
  var snake = [];
  var prevSnake = [];
  var dirX = 1, dirY = 0;
  var turnBuf = [];
  var lastStep = null;
  var foodX = 5, foodY = 5;
  var currentCtrl = CONTROLS[0];
  var score = 0;
  var alive = false;
  var animT = 0;
  var lastTick = 0;
  var tickProgress = 1;
  var rafId = null;
  var justAte = false;
  var ateTime = 0;
  var CASCADE_DURATION = 180;
  var CASCADE_STAGGER = 35;
  var camYaw = 0;
  var lastFrame = 0;
  var answer = '';
  var over = false;

  var THEME_KEY = 'cyber-snake-theme';
  var theme = 'classic';
  try { if (localStorage.getItem(THEME_KEY) === 'cyber') theme = 'cyber'; } catch (e) {}

  function shuffle() {
    var data = activeData();
    for (var i = data.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = data[i]; data[i] = data[j]; data[j] = tmp;
    }
    ctrlIdx = 0;
  }

  function nextCtrl() {
    var data = activeData();
    if (ctrlIdx >= data.length) shuffle();
    currentCtrl = data[ctrlIdx++];
    return currentCtrl;
  }

  function flash(ctrl) {
    if (flashIdEl && flashNameEl) {
      flashIdEl.textContent = ctrl[0];
      flashNameEl.textContent = ctrl[1];
      flashIdEl.classList.add('show');
      flashNameEl.classList.add('show');
    }
  }

  var hudLabelEl = document.getElementById('hud-label');

  function initSnake() {
    var mx = Math.floor(COLS / 2);
    var my = Math.floor(ROWS / 2);
    snake = [{ x: mx, y: my }, { x: mx - 1, y: my }, { x: mx - 2, y: my }];
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    dirX = 1; dirY = 0;
    score = 0; animT = 0; justAte = false; over = false;
    jumps = []; digHeld = false; digAmt = 0; digDepth = 0;
    answer = ''; turnBuf = []; lastStep = null; camYaw = Math.atan2(dirY, dirX); lastFrame = 0;
    if (scoreEl) scoreEl.textContent = '0';
    if (ctrlEl) ctrlEl.textContent = '-';
    if (hudLabelEl) hudLabelEl.textContent = gameMode === 'controls' ? 'Control' : 'Port';
    if (flashIdEl) flashIdEl.classList.remove('show');
    if (flashNameEl) flashNameEl.classList.remove('show');
    shuffle();
    dropFood();
  }

  function dropFood() {
    var fx, fy, ok, i;
    do {
      ok = true;
      fx = Math.floor(Math.random() * COLS);
      fy = Math.floor(Math.random() * ROWS);
      for (i = 0; i < snake.length; i++) {
        if (snake[i].x === fx && snake[i].y === fy) { ok = false; break; }
      }
    } while (!ok);
    foodX = fx; foodY = fy;
    nextCtrl();
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
  function smooth(t) { t = clamp01(t); return t * t * (3 - 2 * t); }
  function easeInOut(t) { t = clamp01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function drawBall(cx, cy, r, color, glowColor, glowStrength, alpha, glowPad) {
    ctx.save();
    ctx.globalAlpha = alpha;

    if (glowStrength > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r + glowPad, 0, Math.PI * 2);
      ctx.fillStyle = glowColor;
      ctx.globalAlpha = alpha * glowStrength * 0.35;
      ctx.fill();
      ctx.globalAlpha = alpha;
    }

    var grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    grad.addColorStop(0, lightenColor(color, 40));
    grad.addColorStop(0.6, color);
    grad.addColorStop(1, darkenColor(color, 30));
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx - r * 0.25, cy - r * 0.3, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();

    ctx.restore();
  }

  function lightenColor(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function darkenColor(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function greenBlend() {
    if (score < 30) return 0;
    return Math.min((score - 30) / 40, 1);
  }

  // near: the body just behind the head; far: the tail. After score 30 the body blends towards stops.
  var SNAKE_COLORS = {
    classic: {
      head: '#60a5fa', headGlow: 'rgba(96,165,250,0.5)', near: [234, 179, 8], far: [220, 50, 38],

        { pos: 0,    r: 255, g: 30,  b: 90  },
        { pos: 0.25, r: 255, g: 110, b: 0   },
        { pos: 0.5,  r: 255, g: 230, b: 0   },
        { pos: 0.75, r: 57,  g: 255, b: 20  },
        { pos: 1,    r: 0,   g: 210, b: 120 }
      ]
    }
  };

  function sampleGradient(stops, t) {
    if (t <= 0) return stops[0];
    if (t >= 1) return stops[stops.length - 1];
    for (var i = 0; i < stops.length - 1; i++) {
      var a = stops[i], b = stops[i + 1];
      if (t >= a.pos && t <= b.pos) {
        var local = (t - a.pos) / (b.pos - a.pos);
        return {
          r: Math.round(lerp(a.r, b.r, local)),
          g: Math.round(lerp(a.g, b.g, local)),
          b: Math.round(lerp(a.b, b.b, local))
        };
      }
    }
    return stops[0];
  }

  function segmentRgb(i, len) {
    var pal = SNAKE_COLORS[theme];
    var t = i / Math.max(len - 1, 1);
    var gb = greenBlend();
    var rgb = [0, 1, 2].map(function (k) { return Math.round(lerp(pal.near[k], pal.far[k], t)); });
    if (gb > 0) {
      var c = sampleGradient(pal.stops, t);
      rgb = [Math.round(lerp(rgb[0], c.r, gb)), Math.round(lerp(rgb[1], c.g, gb)), Math.round(lerp(rgb[2], c.b, gb))];
    }
    return rgb;
  }

  function colorForSegment(i, len) {
    if (i === 0) return SNAKE_COLORS[theme].head;
    var c = segmentRgb(i, len);
    return '#' + ((1 << 24) + (c[0] << 16) + (c[1] << 8) + c[2]).toString(16).slice(1);
  }

  function glowForSegment(i, len) {
    if (i === 0) return SNAKE_COLORS[theme].headGlow;
    return 'rgba(' + segmentRgb(i, len).join(',') + ',0.5)';
  }

  function blendHex(hexA, hexB, t) {
    var rA = parseInt(hexA.slice(1,3),16), gA = parseInt(hexA.slice(3,5),16), bA = parseInt(hexA.slice(5,7),16);
    var rB = parseInt(hexB.slice(1,3),16), gB = parseInt(hexB.slice(3,5),16), bB = parseInt(hexB.slice(5,7),16);
    var r = Math.round(lerp(rA, rB, t));
    var g = Math.round(lerp(gA, gB, t));
    var b = Math.round(lerp(bA, bB, t));
    return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  function segmentStyle(i, len, sinceAte) {
    var col = colorForSegment(i, len);
    var glow = glowForSegment(i, len);
    var glowStr = i === 0 ? 0.8 : (0.5 - (i / len) * 0.3);
    var grow = 0;

    var segDelay = i * CASCADE_STAGGER;
    var segElapsed = sinceAte - segDelay;
    if (segElapsed > 0 && segElapsed < CASCADE_DURATION) {
      var half = CASCADE_DURATION / 2;
      var greenT = segElapsed < half
        ? segElapsed / half
        : 1 - (segElapsed - half) / half;
      greenT = greenT * greenT * (3 - 2 * greenT);
      col = blendHex(col, SNAKE_COLORS[theme].eat, greenT * 0.85);
      glow = 'rgba(' + SNAKE_COLORS[theme].eatRgb + ',' + (0.5 * greenT).toFixed(2) + ')';
      glowStr = Math.max(glowStr, 0.7 * greenT);
      grow = 1.5 * greenT;
    }
    return { col: col, glow: glow, glowStr: Math.max(0, glowStr), grow: grow };
  }

  function tagFont(px) { return 'bold ' + Math.round(px) + 'px -apple-system, "Segoe UI", Consolas, monospace'; }

  function tagWidth(text, px) {
    ctx.save();
    ctx.font = tagFont(px);
    var w = ctx.measureText(text).width + px * 1.2;
    ctx.restore();
    return w;
  }

  function pillPath(x, y, w, h) {
    var r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
  }

  // align is the side of the tag that sits at x ('left', 'right' or 'center'); y is its vertical middle.
  function drawTag(text, x, y, align, px, border) {
    var w = tagWidth(text, px);
    var h = px * 1.8;
    var left = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
    left = Math.max(2, Math.min(canvas.width - w - 2, left));
    ctx.save();
    pillPath(left, y - h / 2, w, h);
    ctx.fillStyle = 'rgba(17,19,24,0.85)';
    ctx.fill();
    ctx.lineWidth = Math.max(1, px * 0.1);
    ctx.strokeStyle = border;
    ctx.stroke();
    ctx.font = tagFont(px);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e4e6eb';
    ctx.fillText(text, left + w / 2, y + px * 0.05);
    ctx.restore();
  }

  function render(now) {
    if (!alive && tickProgress >= 1) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      return;
    }

    if (alive) {
      if (now - lastTick > TICK_MS * 5) lastTick = now;
      while (alive && now - lastTick >= TICK_MS) {
        lastTick += TICK_MS;
        tick();
      }
      if (!alive) return;
    }
    tickProgress = Math.min((now - lastTick) / TICK_MS, 1);
    animT += 0.04;
    drawScene(now);

    rafId = requestAnimationFrame(render);
  }

  // World units are grid cells, the board lies on y = 0 from (0, 0) to (COLS, ROWS),
  // and the camera rides behind and above the head, turning with it.
  // Far enough back that the head and the next two balls are in view.
  var CAM_BACK = 5, CAM_UP = 2.9, LOOK_AHEAD = 2.2, LOOK_UP = 0.3, NEAR = 0.15, WALL_H = 0.7;
  var cam = null;

  function setCamera(hx, hz) {
    var fx = Math.cos(camYaw), fz = Math.sin(camYaw);
    var vx = fx * (CAM_BACK + LOOK_AHEAD), vy = LOOK_UP - CAM_UP, vz = fz * (CAM_BACK + LOOK_AHEAD);
    var vl = Math.sqrt(vx * vx + vy * vy + vz * vz);
    vx /= vl; vy /= vl; vz /= vl;
    var rl = Math.sqrt(vx * vx + vz * vz);
    var rx = -vz / rl, rz = vx / rl;
    cam = {
      x: hx - fx * CAM_BACK, y: CAM_UP, z: hz - fz * CAM_BACK,
      fx: vx, fy: vy, fz: vz,
      rx: rx, rz: rz,
      ux: -rz * vy, uy: rz * vx - rx * vz, uz: rx * vy,
      hx: fx, hz: fz,
      f: canvas.height * 0.95, cx: canvas.width / 2, cy: canvas.height / 2
    };
  }

  function toCam(x, y, z) {
    var dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    return {
      x: dx * cam.rx + dz * cam.rz,
      y: dx * cam.ux + dy * cam.uy + dz * cam.uz,
      z: dx * cam.fx + dy * cam.fy + dz * cam.fz
    };
  }

  function proj(c) { return { x: cam.cx + c.x * cam.f / c.z, y: cam.cy - c.y * cam.f / c.z }; }

  function lerpCam(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t) }; }

  function clipNear(pts) {
    var out = [];
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      var aIn = a.z >= NEAR, bIn = b.z >= NEAR;
      if (aIn) out.push(a);
      if (aIn !== bIn) out.push(lerpCam(a, b, (NEAR - a.z) / (b.z - a.z)));
    }
    return out;
  }

  function worldPolyPath(world) {
    var pts = clipNear(world.map(function (p) { return toCam(p[0], p[1], p[2]); }));
    if (pts.length < 3) return false;
    for (var i = 0; i < pts.length; i++) {
      var p = proj(pts[i]);
      if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
    }
    ctx.closePath();
    return true;
  }

  function fillWorldPoly(world, style) {
    ctx.beginPath();
    if (!worldPolyPath(world)) return;
    ctx.fillStyle = style;
    ctx.fill();
  }

  function worldLine(a, b) {
    var ca = toCam(a[0], a[1], a[2]), cb = toCam(b[0], b[1], b[2]);
    if (ca.z < NEAR && cb.z < NEAR) return;
    if (ca.z < NEAR) ca = lerpCam(ca, cb, (NEAR - ca.z) / (cb.z - ca.z));
    else if (cb.z < NEAR) cb = lerpCam(cb, ca, (NEAR - cb.z) / (ca.z - cb.z));
    var pa = proj(ca), pb = proj(cb);
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
  }

  var BOARD = [[0, 0, 0], [COLS, 0, 0], [COLS, 0, ROWS], [0, 0, ROWS]];

  // Far walls first, so the near ones cover them.
  function sortedWalls() {
    return [
      [[0, 0, 0], [COLS, 0, 0]], [[COLS, 0, 0], [COLS, 0, ROWS]],
      [[COLS, 0, ROWS], [0, 0, ROWS]], [[0, 0, ROWS], [0, 0, 0]]
    ].map(function (w) {
      return { a: w[0], b: w[1], d: toCam((w[0][0] + w[1][0]) / 2, 0, (w[0][2] + w[1][2]) / 2).z };
    }).sort(function (p, q) { return q.d - p.d; });
  }

  function wallTop(w) { return [[w.a[0], WALL_H, w.a[2]], [w.b[0], WALL_H, w.b[2]]]; }

  function fillSky(horizon, cw, ch, top, bottom, ground) {
    var sky = ctx.createLinearGradient(0, 0, 0, Math.max(horizon, 1));
    sky.addColorStop(0, top);
    sky.addColorStop(1, bottom);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = ground;
    ctx.fillRect(0, Math.max(0, horizon), cw, ch);
  }

  function fillFog(horizon, cw, ch, rgb) {
    var fog = ctx.createLinearGradient(0, horizon, 0, horizon + ch * 0.2);
    fog.addColorStop(0, 'rgba(' + rgb + ',0.95)');
    fog.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, horizon, cw, ch * 0.2);
  }

  // Strokes the current path twice: a wide faint pass for the glow, then the line itself.
  function strokeGlow(color, glow, width, s) {
    ctx.strokeStyle = glow;
    ctx.lineWidth = width * 4 * s;
    ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = width * s;
    ctx.stroke();
  }

  // Holding down digs a shallow well under the head that the floor's lines bend down into. It deepens while
  // held, up to DIG_MAX, and springs back when let go.
  var DIG_MAX = 0.6, DIG_SIGMA = 1.5, DIG_R = 4.5, DIG_IN = 700, DIG_OUT = 350, DIG_TAP = 0.2;
  var digHeld = false, digAmt = 0, digDepth = 0, well = { x: 0, z: 0 };

  // Up makes the snake hop: the head rises and falls over JUMP_MS, and each ball behind it makes the same hop
  // where the head did. It's only for show: the snake still eats the food it hops at, and still hits things.
  var JUMP_MS = 520, JUMP_H = 1.0, jumps = [];

  function jump() {
    if (!alive) return;
    var now = performance.now();
    if (jumps.length && now - jumps[jumps.length - 1] < JUMP_MS) return;
    jumps.push(now);
  }

  function liftAt(i, now) {
    var h = 0;
    for (var k = 0; k < jumps.length; k++) {
      var u = (now - jumps[k] - i * TICK_MS) / JUMP_MS;
      if (u > 0 && u < 1) h = Math.max(h, 4 * u * (1 - u));

    return h * JUMP_H;
  }

  function setDig(on) {
    if (on && !alive) return;
    if (on && !digHeld) digAmt = Math.max(digAmt, DIG_TAP);
    digHeld = on;
  }

  function updateDig(dt) {
    digAmt = digHeld ? Math.min(1, digAmt + dt / DIG_IN) : Math.max(0, digAmt - dt / DIG_OUT);
    digDepth = DIG_MAX * (1 - (1 - digAmt) * (1 - digAmt));
  }

  function depthAt(x, z) {
    if (digDepth <= 0) return 0;
    var dx = x - well.x, dz = z - well.z, d2 = dx * dx + dz * dz;
    return d2 >= DIG_R * DIG_R ? 0 : digDepth * Math.exp(-d2 / (2 * DIG_SIGMA * DIG_SIGMA));
  }

  // A floor line at x = at (running along z) or z = at (alongX), from a to b, bent through the well near it.
  function floorLine(alongX, at, a, b) {
    function pt(u) { return alongX ? [u, -depthAt(u, at), at] : [at, -depthAt(at, u), u]; }
    var mid = alongX ? well.x : well.z;
    var lo = Math.max(a, mid - DIG_R), hi = Math.min(b, mid + DIG_R);
    if (digDepth <= 0 || Math.abs(at - (alongX ? well.z : well.x)) >= DIG_R || lo >= hi) {
      worldLine(pt(a), pt(b));
      return;
    }
    var us = [a];
    for (var u = lo; u < hi; u += 0.3) us.push(u);
    us.push(hi, b);
    for (var k = 1; k < us.length; k++) if (us[k] > us[k - 1]) worldLine(pt(us[k - 1]), pt(us[k]));
  }

  function drawClassicArena(horizon, cw, ch, s) {
    fillSky(horizon, cw, ch, '#0f1115', '#1f232a', '#15171c');

    fillWorldPoly(BOARD, '#23272e');
    ctx.beginPath();
    for (var c = 0; c <= COLS; c++) floorLine(false, c, 0, ROWS);
    for (var r = 0; r <= ROWS; r++) floorLine(true, r, 0, COLS);
    ctx.strokeStyle = '#323844';
    ctx.lineWidth = 1 * s;
    ctx.stroke();

    sortedWalls().forEach(function (w) {
      var top = wallTop(w);
      fillWorldPoly([w.a, w.b, top[1], top[0]], '#3a3f4b');
      ctx.beginPath();
      worldLine(top[0], top[1]);
      ctx.strokeStyle = 'rgba(96,165,250,0.8)';
      ctx.lineWidth = 2 * s;
      ctx.stroke();
    });

    fillFog(horizon, cw, ch, '31,35,42');
  }

  // Cybernetic: pitch black around the arena, a black floor with a glowing cyan line every five squares, and
  // light walls. The grid is sparse, so the well also shows as glowing rings.
  var MAJOR = 5;

  function drawCyberArena(cw, ch, s) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);

    fillWorldPoly(BOARD, '#02060c');
    var c, r;
    ctx.beginPath();
    for (c = MAJOR; c < COLS; c += MAJOR) floorLine(false, c, 0, ROWS);
    for (r = MAJOR; r < ROWS; r += MAJOR) floorLine(true, r, 0, COLS);
    strokeGlow('rgba(0,229,255,0.7)', 'rgba(0,229,255,0.1)', 1.3, s);

    if (digDepth > 0.02) {
      ctx.beginPath();
      [0.8, 1.6, 2.4].forEach(function (rr) {
        var y = -depthAt(well.x + rr, well.z);
        for (var k = 0; k < 48; k++) {
          var a0 = k / 48 * Math.PI * 2, a1 = (k + 1) / 48 * Math.PI * 2;
          worldLine([well.x + Math.cos(a0) * rr, y, well.z + Math.sin(a0) * rr],
                    [well.x + Math.cos(a1) * rr, y, well.z + Math.sin(a1) * rr]);
        }
      });
      var ra = digDepth / DIG_MAX;
      strokeGlow('rgba(0,229,255,' + (0.6 * ra).toFixed(3) + ')', 'rgba(0,229,255,' + (0.1 * ra).toFixed(3) + ')', 1, s);
    }

    sortedWalls().forEach(function (w) {
      var top = wallTop(w);
      fillWorldPoly([w.a, w.b, top[1], top[0]], 'rgba(0,229,255,0.1)');
      var len = Math.abs(w.b[0] - w.a[0]) + Math.abs(w.b[2] - w.a[2]);
      var ux = (w.b[0] - w.a[0]) / len, uz = (w.b[2] - w.a[2]) / len;
      ctx.beginPath();
      for (var k = MAJOR; k < len; k += MAJOR) {
        worldLine([w.a[0] + ux * k, 0, w.a[2] + uz * k], [w.a[0] + ux * k, WALL_H, w.a[2] + uz * k]);
      }
      ctx.strokeStyle = 'rgba(0,229,255,0.35)';
      ctx.lineWidth = 1 * s;
      ctx.stroke();
      ctx.beginPath();
      worldLine(top[0], top[1]);
      worldLine(w.a, w.b);
      strokeGlow('#9ffcff', 'rgba(0,229,255,0.22)', 1.8, s);
    });
  }

  // Cybernetic theme, outside the walls, after the CyberRMF apps' screensaver. A field of star-like particles
  // around the arena falls together into an orb beyond the north wall; it shrinks into a dense core, nine small
  // orbs form and circle it, and there it stays. CyberRMF Integrate stands on a sign beyond the west wall. Then
  // the sky keeps going: shooting stars now and then, swarms of particles that gravity pulls into the orb, the odd
  // comet, and, two minutes after the first Start and every two minutes after that, a new object gathering out of
  // particles further off: a quasar, a magnetar or a nebula. Nothing comes apart again.
  var FX_PRIMARY = [0, 150, 255], FX_LIGHT = [120, 245, 255];
  var FX_R = 6.6, FX_DENSE = 0.45, FX_ORBIT_R = FX_R * 0.85, FX_SUB_R = FX_R * 0.12, FX_TILT = 0.5;
  var FX_REST = 2000, FX_RECRUIT = 24000, FX_TRAVEL = 4500, FX_HOLD = 5000, FX_SHRINK = 3000;
  var FX_SUB_FORM = 3500, FX_SPAWN = 15500 + FX_SUB_FORM, FX_ORBIT = 14000, FX_CRUISE = 5;
  var FX_SPAWN_AT = [0, 1200, 3500, 5500, 7500, 9500, 11500, 13500, 15500];
  var FX_SPAWN_ORDER = [0, 5, 2, 7, 4, 1, 6, 3, 8];
  var FX_PHASES = [['recruit', FX_RECRUIT], ['hold', FX_HOLD + FX_SHRINK], ['spawn', FX_SPAWN], ['orbit', FX_ORBIT]];
  var FX_BUILT = FX_RECRUIT + FX_HOLD + FX_SHRINK + FX_SPAWN;
  // The camera looks down, so little sky shows: at full size the orb's top just fits under the top of the view
  // from the north wall, and from further back its lower part sinks behind the arena.
  var FX_ORB = { x: COLS / 2, y: 0, z: -22, n: 2700 };

  // The sign faces the arena from beyond the west wall, so its letters run along -z (left to right as the snake
  // sees them).
  var SIGN = { x: -22, y: 2.6, z: ROWS / 2, ux: 0, uz: -1, cell: 0.34, lines: ['CyberRMF', 'Integrate'] };
  // 5 x 8 blocks: capitals fill the top seven rows; the last row holds the tails of g and y.
  var SIGN_FONT = {
    C: ['01110','10001','10000','10000','10000','10001','01110','00000'],
    R: ['11110','10001','10001','11110','10010','10001','10001','00000'],
    M: ['10001','11011','10101','10101','10001','10001','10001','00000'],
    F: ['11111','10000','10000','11110','10000','10000','10000','00000'],
    I: ['01110','00100','00100','00100','00100','00100','01110','00000'],
    y: ['00000','00000','10001','10001','10001','01111','00001','01110'],
    b: ['10000','10000','10110','11001','10001','10001','11110','00000'],
    e: ['00000','00000','01110','10001','11111','10000','01110','00000'],
    r: ['00000','00000','10110','11001','10000','10000','10000','00000'],
    n: ['00000','00000','10110','11001','10001','10001','10001','00000'],
    t: ['01000','01000','11100','01000','01000','01001','00110','00000'],
    g: ['00000','00000','01111','10001','10001','01111','00001','01110'],
    a: ['00000','00000','01110','00001','01111','10001','01111','00000']
  };

  // A new object every SKY_EVERY after the first Start, taking turns by type; SKY_MAX keeps a long visit from
  // piling up more than the game can draw. Each gathers the same way: its particles fade in around the arena over
  // SKY_APPEAR, fly in nearest first over SKY_RECRUIT, and it lights up at SKY_IGNITE.
  var SKY_EVERY = 120000, SKY_MAX = 9, SKY_TYPES = ['quasar', 'magnetar', 'nebula'];
  var SKY_APPEAR = 3000, SKY_RECRUIT = 16000, SKY_IGNITE = 21000;
  // A quasar: a white-hot core with spikes of light, a disk of particles swirling round it (two spiral arms that
  // turn together, the rest faster the closer in they are), and a jet streaming out of each face of the disk.
  var Q_JETS = 3500, Q_DISK = 700, Q_JET = 140, Q_IN = 0.9;
  var Q_PALETTES = [
    [[255, 255, 255], [160, 250, 255], [0, 229, 255], [140, 90, 255], [255, 40, 214]],
    [[255, 255, 255], [255, 240, 160], [255, 176, 0], [255, 90, 30], [255, 30, 75]],
    [[255, 255, 255], [185, 255, 240], [57, 255, 160], [0, 200, 255], [60, 110, 255]],
    [[255, 255, 255], [255, 210, 245], [255, 92, 214], [177, 75, 255], [90, 60, 255]]
  ];
  // A magnetar: a tiny, fiercely bright star that pulses, loops of its magnetic field traced by particles
  // streaming from pole to pole, and a beam out of each pole, all swinging round as it spins. Now and then it
  // flares.
  var M_LOOPS = 10, M_PER = 56, M_SIZE = 8, M_BEAM = 20, M_SPIN = 9000, M_PULSE = 1100, M_FLARE = 17000;
  var M_PALETTE = [[255, 255, 255], [200, 180, 255], [130, 100, 255], [80, 200, 255], [255, 90, 230]];
  // A nebula: glowing clouds of gas in three colours, dust drifting through them, young stars lighting up inside.
  var N_BLOBS = 10, N_DUST = 520, N_STARS = 7;
  var N_PALETTES = [
    [[255, 60, 170], [110, 50, 220], [0, 200, 220]],
    [[255, 120, 40], [210, 30, 90], [255, 205, 110]],
    [[40, 220, 180], [40, 100, 255], [180, 90, 255]]
  ];
  // The comings and goings, in fx time: a shooting star every STAR_GAP, a swarm falling into the orb every
  // STREAM_GAP once it's built, and a comet crossing every COMET_GAP.
  var STAR_GAP = [6000, 16000], STREAM_N = 360, STREAM_GAP = [60000, 110000], STREAM_FALL = 6500;
  var COMET_GAP = [150000, 240000], COMET_LIFE = 45000, COMET_TAIL = 240;
  var fx = null, skyStart = 0, sky = [];

  function fieldPoint() {
    for (;;) {
      var x = -45 + Math.random() * (COLS + 90), z = -45 + Math.random() * (ROWS + 90);
      if (x > -4 && x < COLS + 4 && z > -4 && z < ROWS + 4) continue;
      return { hx: x, hy: 0.25 + Math.pow(Math.random(), 1.5) * 7, hz: z, tw: Math.random() * 6.28 };
    }
  }

  // Nearest first, slowly at first and then faster.
  function queueRecruits(pts, x, y, z, start, span) {
    pts.forEach(function (p) { p.d = Math.hypot(p.hx - x, p.hy - y, p.hz - z); });
    pts.sort(function (a, b) { return a.d - b.d; });
    pts.forEach(function (p, k) {
      p.at = start + span * Math.sqrt(k / pts.length);
      p.arc = Math.min(6, p.d * 0.08);
      p.ord = k / pts.length;
    });
  }

  function fxSetup() {
    var golden = Math.PI * (3 - Math.sqrt(5)), o = { x: FX_ORB.x, y: FX_ORB.y, z: FX_ORB.z, start: FX_REST, orbit: 0,
                                                     spin: 0, p: [] };
    var tl = Math.hypot(COLS / 2 - o.x, ROWS / 2 - o.z);
    o.tx = (COLS / 2 - o.x) / tl; o.tz = (ROWS / 2 - o.z) / tl;
    for (var i = 0; i < FX_ORB.n; i++) o.p.push(fieldPoint());
    queueRecruits(o.p, o.x, o.y, o.z, 0, FX_RECRUIT);
    // They land in a ball, spread by a stride so the early ones don't bunch on one side.
    var N = o.p.length;
    o.p.forEach(function (p, k) {
      var jj = (k * 7919) % N, uy = 1 - 2 * (jj + 0.5) / N, ur = Math.sqrt(1 - uy * uy), th = jj * golden;
      p.rr = Math.cbrt((k + 0.5) / N);
      p.tx = ur * Math.cos(th) * p.rr; p.ty = uy * p.rr; p.tz = ur * Math.sin(th) * p.rr;
    });
    fx = { t: 0, last: 0, orb: o, sign: signSetup(), pulse: 0, stars: [], stream: null, comet: null,
           nextStar: 20000, nextStream: FX_REST + FX_BUILT + 30000, nextComet: 150000 };
  }

  function randIn(r) { return r[0] + Math.random() * (r[1] - r[0]); }

  function signSetup() {
    var widths = SIGN.lines.map(function (l) { return l.length * 6 - 1; });
    var pw = Math.max.apply(null, widths) + 4, ph = SIGN.lines.length * 9 + 1, lit = {}, text = [], fill = [];
    SIGN.lines.forEach(function (line, li) {
      var c0 = Math.floor((pw - widths[li]) / 2), r0 = 1 + li * 9;
      for (var ci = 0; ci < line.length; ci++) {
        var bm = SIGN_FONT[line[ci]];
        for (var r = 0; r < 8; r++) for (var c = 0; c < 5; c++) if (bm[r][c] === '1') lit[(c0 + ci * 6 + c) + ',' + (r0 + r)] = 1;
      }
    });
    for (var r = 0; r < ph; r++) for (var c = 0; c < pw; c++) (lit[c + ',' + r] ? text : fill).push({ c: c, r: r });
    return { text: text, fill: fill, pw: pw, ph: ph };
  }

  function orbPhase(lt) {
    if (lt < 0) return { ph: 'wait', pt: lt };
    for (var i = 0; i < FX_PHASES.length; i++) {
      if (lt < FX_PHASES[i][1]) return { ph: FX_PHASES[i][0], pt: lt };
      lt -= FX_PHASES[i][1];
    }
    return { ph: 'built', pt: lt };
  }

  // The small orbs circle slowly as they form, spin up once all nine are out, then settle to a steady pace.
  function fxAdvance(now) {
    var dt = fx.last ? Math.min(now - fx.last, 100) : 0;
    fx.last = now;
    fx.t += dt;
    var o = fx.orb, st = orbPhase(fx.t - o.start), pt = st.pt, speed = 0;
    if (st.ph === 'spawn') speed = 1;
    else if (st.ph === 'orbit') speed = pt < 3000 ? 1 + pt / 3000 * 34 : pt < 10000 ? 35 : lerp(35, FX_CRUISE, easeInOut((pt - 10000) / 4000));
    else if (st.ph === 'built') speed = FX_CRUISE;
    o.orbit += dt * 0.0001 * speed;
  }

  function fxEvents() {
    if (fx.t >= fx.nextStar) {
      fx.stars.push(makeShootingStar());
      fx.nextStar = fx.t + randIn(STAR_GAP);
    }
    if (fx.t >= fx.nextStream && !fx.stream) {
      fx.stream = makeStream();
      fx.nextStream = fx.t + randIn(STREAM_GAP);
    }
    if (fx.t >= fx.nextComet && !fx.comet) {
      fx.comet = makeComet();
      fx.nextComet = fx.t + COMET_LIFE + randIn(COMET_GAP);
    }
  }

  function fxScale(ph, pt) {
    if (ph === 'hold') return pt < FX_HOLD ? 1 : lerp(1, FX_DENSE, easeInOut((pt - FX_HOLD) / FX_SHRINK));
    return ph === 'wait' || ph === 'recruit' ? 1 : FX_DENSE;
  }

  function skyCount(now) { return skyStart ? Math.min(SKY_MAX, Math.floor((now - skyStart) / SKY_EVERY)) : 0; }

  function skyAge(o, now) { return now - skyStart - (o.k + 1) * SKY_EVERY; }

  function makeSky(k) {
    var type = SKY_TYPES[k % SKY_TYPES.length], turn = Math.floor(k / SKY_TYPES.length);
    var o = type === 'quasar' ? makeQuasar(turn) : type === 'magnetar' ? makeMagnetar() : makeNebula(turn);
    o.type = type; o.k = k;
    return o;
  }

  // Somewhere near to far from the middle of the arena, in a direction clear of the orb, the sign and the other
  // objects.
  function placeSky(o, near, far) {
    var avoid = [[Math.atan2(FX_ORB.z - ROWS / 2, FX_ORB.x - COLS / 2), 0.3], [Math.PI, 0.45]], ang;
    sky.forEach(function (s) { avoid.push([s.ang, 0.32]); });
    for (var tries = 0; tries < 60; tries++) {
      ang = Math.random() * Math.PI * 2;
      if (avoid.every(function (v) { return Math.abs(Math.atan2(Math.sin(ang - v[0]), Math.cos(ang - v[0]))) > v[1]; })) break;
    }
    o.ang = ang; o.dist = near + Math.random() * (far - near);
    o.x = COLS / 2 + Math.cos(ang) * o.dist; o.z = ROWS / 2 + Math.sin(ang) * o.dist;
  }

  // Two unit vectors square to n and each other.
  function frameAround(n) {
    var el = Math.hypot(n[0], n[2]), e1 = el > 1e-6 ? [n[2] / el, 0, -n[0] / el] : [1, 0, 0];
    return [e1, [n[1] * e1[2] - n[2] * e1[1], n[2] * e1[0] - n[0] * e1[2], n[0] * e1[1] - n[1] * e1[0]]];
  }

  // Its disk tilted 35 to 65 degrees from flat.
  function makeQuasar(turn) {
    var q = { pal: Q_PALETTES[turn % Q_PALETTES.length] }, i;
    placeSky(q, 55, 110);
    var dist = q.dist;
    q.R = 6 + Math.random() * 3; q.L = q.R * 3.2;
    var tilt = (35 + Math.random() * 30) * Math.PI / 180, az = Math.random() * Math.PI * 2;
    var n = [Math.sin(tilt) * Math.cos(az), Math.cos(tilt), Math.sin(tilt) * Math.sin(az)], fr = frameAround(n);
    q.n = n; q.e1 = fr[0]; q.e2 = fr[1];
    // Low enough that the top of the disk fits under the top of the view from as close as the snake gets.
    q.y = Math.min(7, 2.9 + 0.12 * (dist - 18) - q.R * Math.sin(tilt));
    var dir = Math.random() < 0.5 ? 1 : -1, wArm = dir * Math.PI * 2 / 24000, wOut = dir * Math.PI * 2 / 40000;
    q.p = [];
    for (i = 0; i < Q_DISK; i++) {
      var p = fieldPoint(), r;
      if (i < Q_DISK * 0.6) {
        r = Q_IN + (q.R - Q_IN) * Math.sqrt(Math.random());
        p.th = (i % 2) * Math.PI + 2.4 * Math.log(r / Q_IN) + (Math.random() - 0.5) * 0.5;
        p.w = wArm;
      } else {
        r = Q_IN + (q.R - Q_IN) * Math.pow(Math.random(), 1.6);
        p.th = Math.random() * Math.PI * 2;
        p.w = wOut * Math.min(14, Math.pow(q.R / r, 1.5));
      }
      var fr = (r - Q_IN) / (q.R - Q_IN);
      p.r = r; p.h = (Math.random() - 0.5) * 0.3 * (0.3 + fr);
      p.bk = Math.min(4, Math.floor(fr * 5)); p.a = 0.95 - 0.45 * fr;
      q.p.push(p);
    }
    queueRecruits(q.p, q.x, q.y, q.z, SKY_APPEAR, SKY_RECRUIT);
    q.j = [];
    for (i = 0; i < Q_JET * 2; i++) q.j.push({ s: Math.random(), phi: Math.random() * Math.PI * 2, side: i < Q_JET ? 1 : -1 });
    q.cols = q.pal.map(rgbStr);
    return q;
  }

  // Its spin axis up to 20 degrees off vertical and its magnetic axis 35 degrees off that, so the field and
  // beams sweep round. Each loop is a dipole field line, r = L sin^2(theta) from the star.
  function makeMagnetar() {
    var m = { pal: M_PALETTE, dir: Math.random() < 0.5 ? 1 : -1, chi: 0.6 }, a = Math.random() * 0.35, b = Math.random() * Math.PI * 2;
    placeSky(m, 50, 85);
    m.y = Math.min(7, 2.9 + 0.12 * (m.dist - 18) - M_SIZE * 0.8);
    m.A = [Math.sin(a) * Math.cos(b), Math.cos(a), Math.sin(a) * Math.sin(b)];
    var fr = frameAround(m.A);
    m.P = fr[0]; m.Q = fr[1];
    m.p = [];
    for (var i = 0; i < M_LOOPS; i++) {
      var phi = i * Math.PI * 2 / M_LOOPS + (Math.random() - 0.5) * 0.3, L = M_SIZE * (0.55 + Math.random() * 0.45);
      for (var j = 0; j < M_PER; j++) {
        var p = fieldPoint();
        p.phi = phi; p.L = L; p.s = (j + Math.random()) / M_PER; p.bk = 2 + i % 3;
        m.p.push(p);
      }
    }
    queueRecruits(m.p, m.x, m.y, m.z, SKY_APPEAR, SKY_RECRUIT);
    m.cols = m.pal.map(rgbStr);
    return m;
  }

  // The magnetic axis y, swung round the spin axis, with x and z square to it.
  function magnetarFrame(m, lt) {
    var w = m.dir * lt * Math.PI * 2 / M_SPIN, c = Math.cos(w), s = Math.sin(w), ci = Math.cos(m.chi), si = Math.sin(m.chi);
    var y = [], x = [];
    for (var i = 0; i < 3; i++) {
      y.push(ci * m.A[i] + si * (c * m.P[i] + s * m.Q[i]));
      x.push(-s * m.P[i] + c * m.Q[i]);
    }
    return { x: x, y: y, z: [x[1] * y[2] - x[2] * y[1], x[2] * y[0] - x[0] * y[2], x[0] * y[1] - x[1] * y[0]] };
  }

  // Clouds along a curving filament, facing the arena, with dust spread through them and a few stars inside.
  function makeNebula(turn) {
    var nb = { pal: N_PALETTES[turn % N_PALETTES.length] }, i;
    placeSky(nb, 80, 120);
    nb.S = 18 + Math.random() * 8;
    // Wide and flat, low enough that the clouds' bright middles fit under the top of the view.
    nb.y = 1.5 + 0.045 * nb.dist;
    var wx = (COLS / 2 - nb.x) / nb.dist, wz = (ROWS / 2 - nb.z) / nb.dist, bend = Math.random() * Math.PI * 2;
    nb.u = [-wz, 0, wx]; nb.w = [wx, 0, wz];
    nb.blobs = [];
    for (i = 0; i < N_BLOBS; i++) {
      var t = i / (N_BLOBS - 1) - 0.5;
      nb.blobs.push({
        u: t * nb.S * 1.8 + (Math.random() - 0.5) * nb.S * 0.15,
        v: Math.sin(t * Math.PI * 1.3 + bend) * nb.S * 0.12 + (Math.random() - 0.5) * nb.S * 0.08,
        w: (Math.random() - 0.5) * nb.S * 0.3,
        r: nb.S * (0.28 + Math.random() * 0.22), c: i % 3, ph: Math.random() * 6.28
      });
    }
    nb.p = [];
    for (i = 0; i < N_DUST; i++) {
      var bl = nb.blobs[Math.floor(Math.random() * N_BLOBS)], p = fieldPoint(), g = Math.pow(Math.random(), 0.7) * bl.r * 0.9;
      var gt = Math.random() * Math.PI * 2, gp = Math.acos(2 * Math.random() - 1);
      p.ou = bl.u + g * Math.sin(gp) * Math.cos(gt); p.ov = bl.v + g * Math.cos(gp) * 0.6; p.ow = bl.w + g * Math.sin(gp) * Math.sin(gt);
      p.bk = bl.c; p.a = 0.15 + Math.random() * 0.25;
      nb.p.push(p);
    }
    queueRecruits(nb.p, nb.x, nb.y, nb.z, SKY_APPEAR, SKY_RECRUIT);
    nb.stars = [];
    for (i = 0; i < N_STARS; i++) {
      var sb = nb.blobs[1 + Math.floor(Math.random() * (N_BLOBS - 2))];
      nb.stars.push({ u: sb.u + (Math.random() - 0.5) * sb.r, v: sb.v + (Math.random() - 0.5) * sb.r * 0.6, w: sb.w,
                      at: SKY_IGNITE - 2000 + i * 900, c: Math.floor(Math.random() * 3), ph: Math.random() * 6.28 });
    }
    nb.cols = nb.pal.map(function (c) { return rgbStr(c.map(function (v) { return Math.round(lerp(v, 255, 0.35)); })); });
    return nb;
  }

  function nebulaAt(nb, u, v, w) {
    return [nb.x + nb.u[0] * u + nb.w[0] * w, nb.y + v, nb.z + nb.u[2] * u + nb.w[2] * w];
  }

  // Low across the sky ahead of the camera, sideways and dropping a little; gone in a second or so.
  function makeShootingStar() {
    var yaw = camYaw + (Math.random() - 0.5) * 0.9, D = 45 + Math.random() * 50, el = (2 + Math.random() * 4.5) * Math.PI / 180;
    var dir = yaw + (Math.random() < 0.5 ? 1 : -1) * (Math.PI / 2 + (Math.random() - 0.5) * 0.7), v = 0.012 + Math.random() * 0.01;
    return { x: cam.x + Math.cos(yaw) * D, y: cam.y + D * Math.tan(el), z: cam.z + Math.sin(yaw) * D,
             vx: Math.cos(dir) * v, vy: -v * (0.05 + Math.random() * 0.13), vz: Math.sin(dir) * v,
             born: fx.t, life: 900 + Math.random() * 700, len: 9 + Math.random() * 7 };
  }

  // A swarm of star-like particles, mostly in the field round the arena and some low round the snake, wherever
  // it is, that gravity then pulls into the orb: nearest first, each spiralling in faster and faster.
  function makeStream() {
    var o = fx.orb, pts = [], ax = cam.x + Math.cos(camYaw) * 9, az = cam.z + Math.sin(camYaw) * 9;
    for (var i = 0; i < STREAM_N; i++) {
      var ar = 13 * Math.sqrt(Math.random()), at = Math.random() * Math.PI * 2;
      var p = i < STREAM_N * 0.3
        ? { hx: ax + Math.cos(at) * ar, hy: 0.6 + Math.random() * 2.6, hz: az + Math.sin(at) * ar, tw: Math.random() * 6.28 }
        : fieldPoint();
      p.swirl = (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 1.2);
      pts.push(p);
    }
    queueRecruits(pts, o.x, o.y, o.z, 3000, 9000);
    return { born: fx.t, p: pts };
  }

  // Drifting round the arena high up, starting off to one side of where the camera is looking.
  function makeComet() {
    var side = Math.random() < 0.5 ? 1 : -1, look = Math.atan2(cam.z + Math.sin(camYaw) * 60 - ROWS / 2, cam.x + Math.cos(camYaw) * 60 - COLS / 2);
    var c = { a0: look - side * 0.45, side: side, D: 55 + Math.random() * 30, h0: 7 + Math.random() * 3, born: fx.t, t: [] };
    for (var i = 0; i < COMET_TAIL; i++) c.t.push({ s: Math.random(), sp: (Math.random() - 0.5) * 2, sq: (Math.random() - 0.5) * 2, bk: i % 3 });
    return c;
  }

  function cometPos(c, u) {
    var a = c.a0 + c.side * 0.9 * u;
    return [COLS / 2 + Math.cos(a) * c.D, c.h0 - 1.5 * u, ROWS / 2 + Math.sin(a) * c.D];
  }

  function rgbStr(c) { return 'rgb(' + c.join(',') + ')'; }

  function rgbaStr(c, a) { return 'rgba(' + c.join(',') + ',' + Math.min(1, a).toFixed(3) + ')'; }

  function sphereVisible(x, y, z, r) {
    var c = toCam(x, y, z);
    if (c.z < -r) return false;
    if (c.z < r + 1) return true;
    var p = proj(c), m = r * cam.f / c.z;
    return p.x > -m && p.x < canvas.width + m && p.y > -m && p.y < canvas.height + m;
  }

  function drawFx(now, s) {
    if (!fx) fxSetup();
    fxAdvance(now);
    fxEvents();
    while (sky.length < skyCount(now)) sky.push(makeSky(sky.length));
    var o = fx.orb, st = orbPhase(fx.t - o.start);
    o.ph = st.ph; o.pt = st.pt; o.scale = fxScale(o.ph, o.pt);
    ctx.save();
    clipOutFloor();
    drawFxSign();
    ctx.globalCompositeOperation = 'lighter';
    sky.forEach(function (k) {
      if (k.type === 'quasar') quasarGlow(k, now);
      else if (k.type === 'magnetar') magnetarGlow(k, now);
      else nebulaGlow(k, now);
    });
    orbGlow(o);
    fx.stars = fx.stars.filter(function (st) { return drawShootingStar(st, s); });
    if (fx.comet && !cometGlow(fx.comet, s)) fx.comet = null;
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    sky.forEach(function (k) {
      if (k.type === 'quasar') quasarParticles(k, now, s);
      else if (k.type === 'magnetar') magnetarParticles(k, now, s);
      else nebulaParticles(k, now, s);
    });
    orbParticles(o, s);
    fx.pulse = 0;
    if (fx.stream && !streamParticles(fx.stream, s)) fx.stream = null;
    if (fx.comet) cometParticles(fx.comet, s);
    ctx.restore();
  }

  // The orb, sky objects and sign stand beyond the walls, so wherever the floor is in front of them they're under
  // it and hidden. Particles also fly over the floor, so they're checked one by one instead.
  function clipOutFloor() {
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, canvas.height);
    worldPolyPath(BOARD);
    ctx.clip('evenodd');
  }

  // The halo, and the small orbs on a ring tilted up on the side facing the arena, so from the snake they pass
  // across the front of the orb and then behind it.
  function orbGlow(o) {
    if (o.ph === 'wait' || !sphereVisible(o.x, o.y, o.z, FX_R * 1.6)) return;
    var oc = toCam(o.x, o.y, o.z);
    if (oc.z > NEAR + FX_R) {
      var I = (o.ph === 'recruit' ? 0.3 * o.pt / FX_RECRUIT : 0.3) + fx.pulse;
      var p = proj(oc), r = FX_R * o.scale * (1 + fx.pulse * 0.5) * cam.f / oc.z;
      var grad = ctx.createRadialGradient(p.x, p.y, r * 0.6, p.x, p.y, r * 1.6);
      grad.addColorStop(0, 'rgba(0,229,255,0)');
      grad.addColorStop(0.35, 'rgba(0,229,255,' + (I * 0.25).toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(0,229,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    if (o.ph !== 'spawn' && o.ph !== 'orbit' && o.ph !== 'built') return;
    var ct = Math.cos(FX_TILT), st = Math.sin(FX_TILT);
    for (var i = 0; i < FX_SPAWN_AT.length; i++) {
      var formT = o.ph === 'spawn' ? clamp01((o.pt - FX_SPAWN_AT[i]) / FX_SUB_FORM) : 1;
      if (formT < 0.1) continue;
      var a = FX_SPAWN_ORDER[i] * Math.PI * 2 / FX_SPAWN_AT.length + o.orbit;
      var lx = Math.cos(a) * FX_ORBIT_R, lz = Math.sin(a) * FX_ORBIT_R;
      var c = toCam(o.x + lx * o.tz + lz * ct * o.tx, o.y + lz * st, o.z - lx * o.tx + lz * ct * o.tz);
      if (c.z >= NEAR + FX_SUB_R) fxSubOrb(c, smooth(formT));
    }
  }

  function fxSubOrb(c, i) {
    var p = proj(c), g = FX_SUB_R * cam.f / c.z * 1.6;
    var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, g);
    grad.addColorStop(0, 'rgba(235,255,255,' + (0.95 * i).toFixed(3) + ')');
    grad.addColorStop(0.45, 'rgba(120,245,255,' + (0.7 * i).toFixed(3) + ')');
    grad.addColorStop(1, 'rgba(0,150,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, g, 0, Math.PI * 2);
    ctx.fill();
  }

  // A white-hot core that flares as the quasar ignites, a faint glow in the disk's colour, and spikes of
  // light across the core like a bright star seen through a telescope.
  function quasarGlow(q, now) {
    var lt = skyAge(q, now), ign = smooth(clamp01((lt - SKY_IGNITE + 3000) / 3000));
    if (ign <= 0 || !sphereVisible(q.x, q.y, q.z, q.R * 1.4)) return;
    var c = toCam(q.x, q.y, q.z);
    if (c.z < 2) return;
    var p = proj(c), k = cam.f / c.z, pal = q.pal, white = [255, 255, 255];
    var flash = lt > SKY_IGNITE ? Math.exp(-Math.pow((lt - SKY_IGNITE) / 700, 2)) : 0;
    var I = ign * (1 + 0.12 * Math.sin(lt * 0.003));
    var hr = q.R * 1.4 * k, g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, hr);
    g.addColorStop(0, rgbaStr(pal[3], 0.12 * I));
    g.addColorStop(1, rgbaStr(pal[3], 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, hr, 0, Math.PI * 2);
    ctx.fill();
    var rc = 1.1 * k * (1 + 3 * flash);
    g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rc);
    g.addColorStop(0, rgbaStr(white, 0.95 * I + flash));
    g.addColorStop(0.3, rgbaStr(pal[1], 0.7 * I));

  // Where the comet is, which way it's heading, which way its tails stream (back along its path and away from

  // The head and its haze, and the ion tail: a straight, thin blue streak.

    var spin = fx.t * 0.0002 + o.spin, cs = Math.cos(spin), sn = Math.sin(spin), R = FX_R * o.scale;
    var rt = ph === 'recruit' ? pt : ph === 'hold' ? FX_RECRUIT + pt : -1;

    var wave = ph === 'hold' && pt < FX_HOLD ? lerp(0.3, 0, smooth((pt - FX_HOLD * 0.75) / (FX_HOLD * 0.25))) : 0;

  // A panel of blocks, the letters lit and the rest dim, standing upright and facing the arena.

    var sg = fx.sign, C = SIGN.cell, f = cam.f, W = canvas.width, H = canvas.height;

    var o = toCam(SIGN.x - SIGN.ux * hw, SIGN.y + (sg.ph - 1) / 2 * C, SIGN.z - SIGN.uz * hw);
    var exX = hx * cam.rx + hz * cam.rz, exY = hx * cam.ux + hz * cam.uz, exZ = hx * cam.fx + hz * cam.fz;
    var eyY = -C * cam.uy, eyZ = -C * cam.fy;
    var side = 0.75 * C * f, squash = Math.max(Math.abs(SIGN.ux * cam.rx + SIGN.uz * cam.rz), 0.15);
    function block(cell) {
      var cz = o.z + cell.c * exZ + cell.r * eyZ;
      if (cz < 1) return;
      var sx = cam.cx + (o.x + cell.c * exX) * f / cz, sy = cam.cy - (o.y + cell.c * exY + cell.r * eyY) * f / cz;
      if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) return;
      var q = side / cz;
      ctx.fillRect(sx - q * squash / 2, sy - q / 2, q * squash, q);
    }
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = rgbStr(FX_PRIMARY);
    sg.fill.forEach(block);
    var tc = [];
    for (var ch = 0; ch < 3; ch++) tc.push(Math.round(lerp(FX_LIGHT[ch], 255, 0.4)));
    ctx.globalAlpha = 0.675;
    ctx.fillStyle = rgbStr(tc);
    sg.text.forEach(block);
    ctx.globalAlpha = 1;
  }

  // Classic: a dark shadow under each ball. Cybernetic: a glow on the floor in the ball's own colour.
  // Both shrink under a ball in the air and follow the floor down into the well.
  function drawFloorMarks(items) {
    var cyber = theme === 'cyber';
    var off = cyber ? 0 : 0.06, size = cyber ? 1.3 : 0.95;
    if (!cyber) ctx.beginPath();
    items.forEach(function (it) {
      var pts = [], rr = it.r * size / (1 + it.lift * 0.7);
      for (var k = 0; k < 16; k++) {
        var a = k / 16 * Math.PI * 2;
        var px = it.x + off + Math.cos(a) * rr, pz = it.z + off + Math.sin(a) * rr;
        var p = toCam(px, -depthAt(px, pz), pz);
        if (p.z < NEAR) return;
        pts.push(proj(p));
      }
      if (cyber) ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
      ctx.closePath();
      if (cyber) {
        ctx.save();
        ctx.globalAlpha = 0.6 / (1 + it.lift);
        ctx.fillStyle = it.glow;
        ctx.fill();
        ctx.restore();
      }
    });
    if (!cyber) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();
    }
  }

  function drawScene(now) {
    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;
    var t = tickProgress;

    var dt = lastFrame ? Math.min(now - lastFrame, 100) : 0;
    lastFrame = now;
    var turnBy = Math.atan2(dirY, dirX) - camYaw;
    while (turnBy > Math.PI) turnBy -= Math.PI * 2;
    while (turnBy < -Math.PI) turnBy += Math.PI * 2;
    camYaw += dt ? turnBy * (1 - Math.exp(-dt / 60)) : turnBy;

    updateDig(dt);
    while (jumps.length && now - jumps[0] > JUMP_MS + snake.length * TICK_MS) jumps.shift();

    var head = snake[0], headPrev = prevSnake[0] || head;
    well.x = lerp(headPrev.x, head.x, t) + 0.5;
    well.z = lerp(headPrev.y, head.y, t) + 0.5;
    setCamera(well.x, well.z);

    if (theme === 'cyber') { drawCyberArena(cw, ch, s); drawFx(now, s); }
    else {
      var horizon = cam.cy - (cam.hx * cam.ux + cam.hz * cam.uz) / (cam.hx * cam.fx + cam.hz * cam.fz) * cam.f;
      drawClassicArena(horizon, cw, ch, s);
    }

    var items = [];
    var len = snake.length;
    var sinceAte = ateTime > 0 ? now - ateTime : 99999;
    for (var i = 0; i < len; i++) {
      var cur = snake[i], prev = prevSnake[i] || cur;
      var st = segmentStyle(i, len, sinceAte);
      var segR = (i === 0 ? 0.48 : 0.44 * (1 - (i / len) * 0.25)) + st.grow / G;
      var sx = lerp(prev.x, cur.x, t) + 0.5, sz = lerp(prev.y, cur.y, t) + 0.5, lift = liftAt(i, now);
      items.push({ x: sx, y: segR + lift - depthAt(sx, sz), z: sz, r: segR, lift: lift,
                   col: st.col, glow: st.glow, glowStr: st.glowStr });
    }
    var headItem = items[0];
    var pulse = 0.5 + 0.5 * Math.sin(animT);
    var foodR = 0.46 + pulse * 0.05;
    var food = { x: foodX + 0.5, z: foodY + 0.5, r: foodR, lift: 0,
                 col: '#22c55e', glow: 'rgba(34,197,94,0.6)', glowStr: 0.6 + pulse * 0.4 };
    food.y = foodR + 0.1 + pulse * 0.12 - depthAt(food.x, food.z);
    items.push(food);

    drawFloorMarks(items);

    items.forEach(function (it) {
      it.c = toCam(it.x, it.y, it.z);
      if (it.c.z < NEAR + it.r) return;
      var p = proj(it.c);
      it.sx = p.x; it.sy = p.y; it.sr = it.r * cam.f / it.c.z;
    });
    items.slice().sort(function (p, q) { return q.c.z - p.c.z; }).forEach(function (it) {
      if (!it.sr) return;
      var hidesHead = it !== headItem && it.c.z < headItem.c.z &&
        Math.hypot(it.sx - headItem.sx, it.sy - headItem.sy) < it.sr + headItem.sr;
      drawBall(it.sx, it.sy, it.sr, it.col, it.glow, it.glowStr, hidesHead ? 0.45 : 1, it.sr * 0.2);
    });

    var foodSeen = food.sr && food.sx > 0 && food.sx < cw && food.sy > 0 && food.sy < ch;
    if (foodSeen) {
      var fpx = Math.max(10 * s, Math.min(15 * s, food.sr * 0.7));
      drawTag(currentCtrl[0], food.sx, food.sy - food.sr - fpx * 0.9 - 3 * s, 'center', fpx, 'rgba(34,197,94,0.7)');
    } else {
      var dx = food.x - cam.x, dz = food.z - cam.z;
      var onLeft = dx * cam.rx + dz * cam.rz < 0;
      var ax = onLeft ? 14 * s : cw - 14 * s, ay = ch * 0.55;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ax + (onLeft ? -8 : 8) * s, ay);
      ctx.lineTo(ax + (onLeft ? 4 : -4) * s, ay - 9 * s);
      ctx.lineTo(ax + (onLeft ? 4 : -4) * s, ay + 9 * s);
      ctx.closePath();
      ctx.fillStyle = 'rgba(34,197,94,0.9)';
      ctx.fill();
      ctx.restore();
      drawTag(currentCtrl[0], ax + (onLeft ? 10 : -10) * s, ay, onLeft ? 'left' : 'right', 11 * s, 'rgba(34,197,94,0.7)');
    }

    if (answer && headItem.sr) {
      var ap = proj(toCam(headItem.x, headItem.y + headItem.r + 0.3, headItem.z));
      drawTag(answer, ap.x, ap.y, 'center', 13 * s, 'rgba(96,165,250,0.7)');
    }
  }

  function tick() {
    var next = turnBuf.shift();
    var turned = !!next && (next.x !== dirX || next.y !== dirY);
    if (next) { dirX = next.x; dirY = next.y; }
    var nx = snake[0].x + dirX;
    var ny = snake[0].y + dirY;

    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { die(); return; }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { die(); return; }
    }

    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });

    snake.unshift({ x: nx, y: ny });

    if (nx === foodX && ny === foodY) {
      score++;
      justAte = true;
      ateTime = performance.now();
      if (scoreEl) scoreEl.textContent = String(score);
      if (ctrlEl) ctrlEl.textContent = currentCtrl[0];
      flash(currentCtrl);
      answer = currentCtrl[1];
      dropFood();
      prevSnake.unshift({ x: prevSnake[0].x, y: prevSnake[0].y });
    } else {
      snake.pop();
      justAte = false;
    }
    lastStep = { turned: turned };
  }

  // A turn pressed early in a step re-runs that step with the turn, so the head turns from the square it
  // was leaving rather than one square later. Not after a step that turned (that could reverse the snake)
  // or ate (the food has already moved).
  function graceTurn() {
    if (!lastStep || lastStep.turned || justAte || turnBuf.length !== 1) return;
    if (performance.now() - lastTick > TICK_MS * TURN_GRACE) return;
    snake = prevSnake.map(function (s) { return { x: s.x, y: s.y }; });
    tick();
  }

  function die() {
    alive = false;
    over = true;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    drawGameOver();
    runIdle();
  }

  // Between rounds the Cybernetic theme keeps its particle show moving under the still frame.
  var idleId = null;
  function idleFrame(now) {
    idleId = null;
    if (alive || theme !== 'cyber') return;
    drawScene(now);
    if (over) drawGameOver();
    idleId = requestAnimationFrame(idleFrame);
  }
  function runIdle() {
    if (!idleId && !alive && theme === 'cyber') idleId = requestAnimationFrame(idleFrame);
  }

  function drawGameOver() {
    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;

    ctx.fillStyle = 'rgba(26,29,35,0.88)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = 'bold ' + Math.round(22 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#e4e6eb';
    ctx.fillText('Game Over', cw / 2, ch / 2 - 20 * s);

    ctx.font = 'bold ' + Math.round(14 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#60a5fa';
    var dieMsg = gameMode === 'controls' ? ' controls consumed' : ' ports consumed';
    ctx.fillText(score + dieMsg, cw / 2, ch / 2 + 10 * s);

    ctx.font = Math.round(12 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#6b7280';
    ctx.fillText('Press Start to play again', cw / 2, ch / 2 + 36 * s);
  }

  function startGame() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    initSnake();
    alive = true;
    if (!skyStart) skyStart = performance.now();
    lastTick = performance.now();
    tickProgress = 0;
    rafId = requestAnimationFrame(render);
  }

  startBtn.addEventListener('click', startGame);

  // Turns wait in a short line, each checked against the one before it, so two quick turns both happen.
  // Left and right turn from the direction the snake will be facing by then.
  function setDir(dir) {
    if (!alive || turnBuf.length >= TURN_BUFFER) return;
    var last = turnBuf.length ? turnBuf[turnBuf.length - 1] : { x: dirX, y: dirY };
    var nx, ny;
    if (dir === 'left') { nx = last.y; ny = -last.x; }
    else if (dir === 'right') { nx = -last.y; ny = last.x; }
    else return;
    turnBuf.push({ x: nx, y: ny });
    graceTurn();
  }

  function press(dir) {
    if (dir === 'up') jump();
    else if (dir === 'down') setDig(true);
    else setDir(dir);
  }

  function release(dir) { if (dir === 'down') setDig(false); }

  var KEY_DIRS = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                   ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k.indexOf('Arrow') === 0) e.preventDefault();
    if (e.repeat || !KEY_DIRS[k]) return;
    press(KEY_DIRS[k]);
  });
  document.addEventListener('keyup', function (e) { if (KEY_DIRS[e.key]) release(KEY_DIRS[e.key]); });
  window.addEventListener('blur', function () { setDig(false); });

  var dpad = document.getElementById('dpad');
  if (dpad) {
    var btns = dpad.querySelectorAll('.dpad-btn');
    for (var b = 0; b < btns.length; b++) {
      (function (btn) {
        var dir = btn.getAttribute('data-dir');

        btn.addEventListener('touchstart', function (e) {
          e.preventDefault();
          btn.classList.add('pressed');
          press(dir);
        }, { passive: false });

        btn.addEventListener('touchend', function (e) {
          e.preventDefault();
          btn.classList.remove('pressed');
          release(dir);
        }, { passive: false });

        btn.addEventListener('mousedown', function (e) {
          e.preventDefault();
          btn.classList.add('pressed');
          press(dir);
        });

        btn.addEventListener('mouseup', function () {
          btn.classList.remove('pressed');
          release(dir);
        });
        btn.addEventListener('mouseleave', function () {
          btn.classList.remove('pressed');
          release(dir);
        });
      })(btns[b]);
    }
  }

  // Swipes act as soon as the finger has moved far enough, and one gesture can chain them (left then right,
  // say); moving on in the same direction doesn't repeat it. Up jumps; down digs until the finger lifts or
  // turns another way.
  var swipeX0 = null, swipeY0 = null, swipeDir = null;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    swipeX0 = t.clientX;
    swipeY0 = t.clientY;
    swipeDir = null;
  }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (swipeX0 === null) return;
    var t = e.touches[0];
    var dx = t.clientX - swipeX0;
    var dy = t.clientY - swipeY0;
    var minSwipe = 20;
    if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
    var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (dir !== swipeDir) {
      if (swipeDir) release(swipeDir);
      press(dir);
    }
    swipeDir = dir;
    swipeX0 = t.clientX; swipeY0 = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function () {
    if (swipeDir) release(swipeDir);
    swipeX0 = null; swipeY0 = null; swipeDir = null;
  }, { passive: true });

  window.switchMode = function (mode) {
    if (mode === gameMode) return;
    gameMode = mode;
    var tabC = document.getElementById('tab-controls');
    var tabP = document.getElementById('tab-ports');
    if (tabC) tabC.classList.toggle('active', mode === 'controls');
    if (tabP) tabP.classList.toggle('active', mode === 'ports');
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    alive = false;
    initSnake();
    sizeCanvas();
    lastTick = performance.now();
    tickProgress = 1;
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    doInitialRender();
    runIdle();
  };

  // The theme only changes the arena's look, so it can change mid-round; between rounds the still
  // frame (and the Game Over card, if showing) is redrawn in the new look.
  function showTheme() {
    var classic = document.getElementById('theme-classic');
    var cyber = document.getElementById('theme-cyber');
    if (classic) classic.classList.toggle('active', theme === 'classic');
    if (cyber) cyber.classList.toggle('active', theme === 'cyber');
    canvas.parentElement.classList.toggle('cyber', theme === 'cyber');
  }

  window.switchTheme = function (t) {
    if (t === theme) return;
    theme = t;
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    showTheme();
    if (alive) return;
    doInitialRender();
    if (over) drawGameOver();
    runIdle();
  };

  initSnake();
  sizeCanvas();
  lastTick = performance.now();
  tickProgress = 1;
  prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });

  function doInitialRender() {
    lastFrame = 0;
    drawScene(performance.now());
  }
  showTheme();
  doInitialRender();
  runIdle();
});
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
