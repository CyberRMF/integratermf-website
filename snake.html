<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CyberRMF — NIST SP 800-53 Snake</title>
  <style>
    :root {
      --bg:     #1a1d23;
      --bg2:    #23272e;
      --bg3:    #252830;
      --border: #3a3f4b;
      --text:   #e4e6eb;
      --muted:  #9ca3af;
      --dim:    #6b7280;
      --accent: #60a5fa;
      --mono:   'Consolas', 'Fira Code', 'SF Mono', 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { touch-action: manipulation; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; text-decoration: none; }

    .top-bar {
      width: 100%;
      max-width: 720px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-link {
      font-size: 12px;
      color: var(--muted);
      transition: color .2s;
    }
    .back-link:hover { color: var(--text); }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      padding: 0 12px;
      flex: 1;
    }
    .game-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .game-sub {
      font-size: 11px;
      color: var(--dim);
      margin-top: 2px;
      -webkit-font-smoothing: antialiased;
    }
    .flash-area {
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 6px 0;
    }
    .flash-id {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      opacity: 0;
      transition: opacity .15s;
      -webkit-font-smoothing: antialiased;
    }
    .flash-name {
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      transition: opacity .15s;
      -webkit-font-smoothing: antialiased;
    }
    .flash-id.show, .flash-name.show { opacity: 1; }

    .canvas-wrap {
      width: 100%;
      position: relative;
    }
    #snake-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .score {
      font-size: 13px;
      color: var(--muted);
      -webkit-font-smoothing: antialiased;
    }
    .score strong { color: var(--accent); }
    .btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 24px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      transition: border-color .2s;
      -webkit-font-smoothing: antialiased;
    }
    .btn:hover { border-color: var(--muted); }

    /* ── Game Tabs ── */
    .game-tabs {
      display: flex;
      gap: 0;
      margin: 8px 0 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .game-tab {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 18px;
      background: transparent;
      border: none;
      color: var(--dim);
      cursor: pointer;
      transition: color .2s, background .2s;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    .game-tab:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: var(--border);
    }
    .game-tab:hover { color: var(--muted); }
    .game-tab.active {
      color: var(--accent);
      background: rgba(96,165,250,0.08);
    }

    /* ── D-pad ── */
    .dpad {
      display: none;
      width: 180px;
      height: 180px;
      position: relative;
      margin: 12px auto 20px;
      flex-shrink: 0;
    }
    .dpad-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background .1s, border-color .1s;
      touch-action: manipulation;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      background: rgba(96,165,250,0.15);
      border-color: var(--accent);
    }
    .dpad-btn svg {
      width: 22px;
      height: 22px;
      fill: var(--muted);
      transition: fill .1s;
    }
    .dpad-btn:active svg, .dpad-btn.pressed svg { fill: var(--accent); }
    .dpad-up    { top: 0;   left: 50%; transform: translateX(-50%); }
    .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dpad-left  { left: 0;  top: 50%;  transform: translateY(-50%); }
    .dpad-right { right: 0; top: 50%;  transform: translateY(-50%); }

    @media (max-width: 600px), (pointer: coarse) {
      .dpad { display: block; }
      .game-sub { font-size: 10px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="https://integratermf.com" class="back-link">&larr; Back to site</a>
  </div>

  <div class="game-wrap">
    <div style="text-align:center">
      <div class="game-title">NIST SP 800-53 Snake</div>
      <div class="game-sub">Eat the controls. Arrow keys, WASD, or D-pad.</div>
    </div>
    <div class="game-tabs">
      <button class="game-tab active" id="tab-controls" onclick="switchMode('controls')">800-53 Controls</button>
      <button class="game-tab" id="tab-ports" onclick="switchMode('ports')">Ports &amp; Protocols</button>
    </div>
    <div class="flash-area">
      <span class="flash-id" id="flash-id"></span>
      <span class="flash-name" id="flash-name"></span>
    </div>
    <div class="canvas-wrap">
      <canvas id="snake-canvas"></canvas>
    </div>
    <div class="hud">
      <span class="score">Score: <strong id="snake-score">0</strong></span>
      <span class="score"><span id="hud-label">Control</span>: <strong id="snake-ctrl">—</strong></span>
      <button class="btn" id="snake-start">Start</button>
    </div>

    <div class="dpad" id="dpad">
      <div class="dpad-btn dpad-up" data-dir="up">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
      </div>
      <div class="dpad-btn dpad-down" data-dir="down">
        <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>
      </div>
      <div class="dpad-btn dpad-left" data-dir="left">
        <svg viewBox="0 0 24 24"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
      </div>
      <div class="dpad-btn dpad-right" data-dir="right">
        <svg viewBox="0 0 24 24"><path d="M20 12l-8 8v-5H4v-6h8V4z"/></svg>
      </div>
    </div>
  </div>

  <script>
window.addEventListener('DOMContentLoaded', function () {
  var canvas = document.getElementById('snake-canvas');
  var startBtn = document.getElementById('snake-start');
  var scoreEl = document.getElementById('snake-score');
  var ctrlEl = document.getElementById('snake-ctrl');
  var flashIdEl = document.getElementById('flash-id');
  var flashNameEl = document.getElementById('flash-name');
  if (!canvas || !startBtn) return;

  var ctx = canvas.getContext('2d');

  var BASE_W = 700;
  var BASE_H = 560;
  var G = 20;
  var COLS = BASE_W / G;
  var ROWS = BASE_H / G;
  var TICK_MS = 80;
  var INPUT_THRESHOLD = 25;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);

  function sizeCanvas() {
    var wrap = canvas.parentElement;
    var cw = wrap.clientWidth;
    var aspect = BASE_W / BASE_H;
    var drawW = cw;
    var drawH = Math.round(cw / aspect);
    canvas.style.width = drawW + 'px';
    canvas.style.height = drawH + 'px';
    canvas.width = Math.round(drawW * dpr);
    canvas.height = Math.round(drawH * dpr);
  }
  sizeCanvas();
  window.addEventListener('resize', function () { sizeCanvas(); });

  function S() { return canvas.width / BASE_W; }

  var CONTROLS = [
    ['AC-1','Policy and Procedures'],['AC-2','Account Management'],['AC-3','Access Enforcement'],
    ['AC-4','Information Flow Enforcement'],['AC-5','Separation of Duties'],['AC-6','Least Privilege'],
    ['AC-7','Unsuccessful Logon Attempts'],['AC-8','System Use Notification'],['AC-11','Device Lock'],
    ['AC-17','Remote Access'],['AC-18','Wireless Access'],['AC-19','Access Control for Mobile Devices'],
    ['AC-20','Use of External Systems'],['AC-22','Publicly Accessible Content'],
    ['AT-1','Policy and Procedures'],['AT-2','Literacy Training and Awareness'],['AT-3','Role-Based Training'],
    ['AU-1','Policy and Procedures'],['AU-2','Event Logging'],['AU-3','Content of Audit Records'],
    ['AU-4','Audit Log Storage Capacity'],['AU-5','Response to Audit Logging Failures'],
    ['AU-6','Audit Record Review, Analysis, and Reporting'],['AU-8','Time Stamps'],
    ['AU-9','Protection of Audit Information'],['AU-11','Audit Record Retention'],['AU-12','Audit Record Generation'],
    ['CA-1','Policy and Procedures'],['CA-2','Control Assessments'],['CA-3','Information Exchange'],
    ['CA-5','Plan of Action and Milestones'],['CA-6','Authorization'],['CA-7','Continuous Monitoring'],
    ['CA-9','Internal System Connections'],['CM-1','Policy and Procedures'],['CM-2','Baseline Configuration'],
    ['CM-3','Configuration Change Control'],['CM-4','Impact Analyses'],['CM-5','Access Restrictions for Change'],

    ['CP-1','Policy and Procedures'],['CP-2','Contingency Plan'],['CP-3','Contingency Training'],
    ['CP-4','Contingency Plan Testing'],['CP-9','System Backup'],['CP-10','System Recovery and Reconstitution'],
    ['IA-1','Policy and Procedures'],['IA-2','Identification and Authentication'],
    ['IA-3','Device Identification and Authentication'],['IA-4','Identifier Management'],
    ['IA-5','Authenticator Management'],['IA-6','Authentication Feedback'],
    ['IA-8','Identification and Authentication (Non-Org Users)'],['IR-1','Policy and Procedures'],
    ['IR-2','Incident Response Training'],['IR-4','Incident Handling'],['IR-5','Incident Monitoring'],
    ['IR-6','Incident Reporting'],['IR-8','Incident Response Plan'],['MA-1','Policy and Procedures'],
    ['MA-2','Controlled Maintenance'],['MA-3','Maintenance Tools'],['MA-5','Maintenance Personnel'],
    ['MP-1','Policy and Procedures'],['MP-2','Media Access'],['MP-6','Media Sanitization'],['MP-7','Media Use'],
    ['PE-1','Policy and Procedures'],['PE-2','Physical Access Authorizations'],['PE-3','Physical Access Control'],
    ['PE-6','Monitoring Physical Access'],['PE-8','Visitor Access Records'],['PE-12','Emergency Lighting'],
    ['PE-13','Fire Protection'],['PE-14','Environmental Controls'],['PE-15','Water Damage Protection'],
    ['PE-16','Delivery and Removal'],['PL-1','Policy and Procedures'],['PL-2','System Security and Privacy Plans'],
    ['PL-4','Rules of Behavior'],['PM-1','Information Security Program Plan'],
    ['PM-2','Information Security Program Leadership Role'],['PM-5','System Inventory'],
    ['PM-6','Measures of Performance'],['PM-9','Risk Management Strategy'],['PM-10','Authorization Process'],
    ['PS-1','Policy and Procedures'],['PS-2','Position Risk Designation'],['PS-3','Personnel Screening'],
    ['PS-4','Personnel Termination'],['PS-5','Personnel Transfer'],['PS-6','Access Agreements'],
    ['PS-7','External Personnel Security'],['PS-8','Personnel Sanctions'],['RA-1','Policy and Procedures'],
    ['RA-2','Security Categorization'],['RA-3','Risk Assessment'],['RA-5','Vulnerability Monitoring and Scanning'],
    ['SA-1','Policy and Procedures'],['SA-2','Allocation of Resources'],['SA-3','System Development Life Cycle'],
    ['SA-4','Acquisition Process'],['SA-5','System Documentation'],['SA-9','External System Services'],
    ['SC-1','Policy and Procedures'],['SC-2','Separation of System and User Functionality'],
    ['SC-4','Information in Shared System Resources'],['SC-5','Denial-of-Service Protection'],
    ['SC-7','Boundary Protection'],['SC-8','Transmission Confidentiality and Integrity'],
    ['SC-10','Network Disconnect'],['SC-12','Cryptographic Key Establishment and Management'],
    ['SC-13','Cryptographic Protection'],['SC-15','Collaborative Computing Devices and Applications'],
    ['SC-20','Secure Name/Address Resolution Service'],
    ['SC-21','Secure Name/Address Resolution Service (Recursive)'],
    ['SC-22','Architecture and Provisioning for Name/Address Resolution'],
    ['SC-28','Protection of Information at Rest'],['SC-39','Process Isolation'],
    ['SI-1','Policy and Procedures'],['SI-2','Flaw Remediation'],['SI-3','Malicious Code Protection'],
    ['SI-4','System Monitoring'],['SI-5','Security Alerts, Advisories, and Directives'],
    ['SI-12','Information Management and Retention'],['SR-1','Policy and Procedures'],
    ['SR-2','Supply Chain Risk Management Plan'],['SR-3','Supply Chain Controls and Processes']
  ];

  var PORTS = [
    ['7','ECHO'],['19','CHARGEN'],['20','FTP-Data'],['21','FTP'],['22','SSH'],
    ['23','Telnet'],['25','SMTP'],['42','WINS Replication'],['43','WHOIS'],['53','DNS'],
    ['66','Oracle SQL*Net'],['67','DHCP/BOOTP Server'],['68','DHCP/BOOTP Client'],
    ['69','TFTP'],['70','Gopher'],['79','Finger'],['80','HTTP'],['88','Kerberos'],
    ['110','POP3'],['111','SunRPC / Portmap'],['113','IDENT / Auth'],['119','NNTP'],
    ['123','NTP'],['135','MSRPC / EPMAP'],['137','NetBIOS Name Service'],
    ['138','NetBIOS Datagram'],['139','NetBIOS Session / SMB'],['143','IMAP'],
    ['161','SNMP'],['162','SNMP Trap'],['177','XDMCP'],['179','BGP'],['194','IRC'],
    ['201','AppleTalk'],['264','BGMP'],['318','TSP'],['381','HP OpenView NNM'],
    ['383','HP OpenView Data'],['389','LDAP'],['411','Direct Connect Hub'],
    ['412','Direct Connect C2S'],['427','SLP'],['443','HTTPS'],['445','SMB / CIFS'],
    ['464','Kerberos Change/Set Password'],['465','SMTPS'],['497','Retrospect'],
    ['500','ISAKMP / IKE'],['512','Rexec'],['513','Rlogin'],['514','RSH / Syslog'],
    ['515','LPD / Line Printer'],['520','RIP'],['521','RIPng'],['540','UUCP'],
    ['546','DHCPv6 Client'],['547','DHCPv6 Server'],['548','AFP'],['554','RTSP'],
    ['560','RMonitor'],['563','NNTPS'],['587','SMTP Submission'],['591','FileMaker'],
    ['593','DCOM / HTTP RPC'],['631','IPP / CUPS'],['636','LDAPS'],['639','MSDP'],
    ['646','LDP'],['691','MS Exchange Routing'],['860','iSCSI'],['873','Rsync'],
    ['902','VMware Server'],['989','FTPS Data'],['990','FTPS Control'],
    ['993','IMAPS'],['995','POP3S']
  ];

  var gameMode = 'controls';
  function activeData() { return gameMode === 'controls' ? CONTROLS : PORTS; }

  var ctrlIdx = 0;
  var snake = [];
  var prevSnake = [];
  var dirX = 1, dirY = 0;
  var ndX = 1, ndY = 0;
  var foodX = 5, foodY = 5;
  var currentCtrl = CONTROLS[0];
  var score = 0;
  var alive = false;
  var tickTimer = null;
  var animT = 0;
  var lastTick = 0;
  var tickProgress = 1;
  var rafId = null;
  var justAte = false;
  var ateTime = 0;
  var CASCADE_DURATION = 180;
  var CASCADE_STAGGER = 35;

  function shuffle() {
    var data = activeData();
    for (var i = data.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = data[i]; data[i] = data[j]; data[j] = tmp;
    }
    ctrlIdx = 0;
  }

  function nextCtrl() {
    var data = activeData();
    if (ctrlIdx >= data.length) shuffle();
    currentCtrl = data[ctrlIdx++];
    return currentCtrl;
  }

  function flash(ctrl) {
    if (flashIdEl && flashNameEl) {
      flashIdEl.textContent = ctrl[0];
      flashNameEl.textContent = ctrl[1];
      flashIdEl.classList.add('show');
      flashNameEl.classList.add('show');
    }
  }

  var hudLabelEl = document.getElementById('hud-label');

  function initSnake() {
    var mx = Math.floor(COLS / 2);
    var my = Math.floor(ROWS / 2);
    snake = [{ x: mx, y: my }, { x: mx - 1, y: my }, { x: mx - 2, y: my }];
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    dirX = 1; dirY = 0; ndX = 1; ndY = 0;
    score = 0; animT = 0; justAte = false;
    if (scoreEl) scoreEl.textContent = '0';
    if (ctrlEl) ctrlEl.textContent = '\u2014';
    if (hudLabelEl) hudLabelEl.textContent = gameMode === 'controls' ? 'Control' : 'Port';
    if (flashIdEl) flashIdEl.classList.remove('show');
    if (flashNameEl) flashNameEl.classList.remove('show');
    shuffle();
    dropFood();
  }

  function dropFood() {
    var fx, fy, ok, i;
    do {
      ok = true;
      fx = Math.floor(Math.random() * COLS);
      fy = Math.floor(Math.random() * ROWS);
      for (i = 0; i < snake.length; i++) {
        if (snake[i].x === fx && snake[i].y === fy) { ok = false; break; }
      }
    } while (!ok);
    foodX = fx; foodY = fy;
    nextCtrl();
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawBubble(cx, cy, r, color, glowColor, glowStrength, alpha) {
    var s = S();
    cx *= s; cy *= s; r *= s;
    ctx.save();
    ctx.globalAlpha = alpha;

    if (glowStrength > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r + 6 * s, 0, Math.PI * 2);
      ctx.fillStyle = glowColor;
      ctx.globalAlpha = alpha * glowStrength * 0.35;
      ctx.fill();
      ctx.globalAlpha = alpha;
    }

    var grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    grad.addColorStop(0, lightenColor(color, 40));
    grad.addColorStop(0.6, color);
    grad.addColorStop(1, darkenColor(color, 30));
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx - r * 0.25, cy - r * 0.3, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();

    ctx.restore();
  }

  function lightenColor(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function darkenColor(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function greenBlend() {
    if (score < 30) return 0;
    return Math.min((score - 30) / 40, 1);
  }

  var GRADIENT_STOPS = [
    { pos: 0,    r: 220, g: 50,  b: 38  },
    { pos: 0.25, r: 234, g: 130, b: 8   },
    { pos: 0.5,  r: 234, g: 200, b: 30  },
    { pos: 0.75, r: 34,  g: 197, b: 94  },
    { pos: 1,    r: 22,  g: 120, b: 50  }
  ];

  function sampleGradient(t) {
    if (t <= 0) return GRADIENT_STOPS[0];
    if (t >= 1) return GRADIENT_STOPS[GRADIENT_STOPS.length - 1];
    for (var i = 0; i < GRADIENT_STOPS.length - 1; i++) {
      var a = GRADIENT_STOPS[i], b = GRADIENT_STOPS[i + 1];
      if (t >= a.pos && t <= b.pos) {
        var local = (t - a.pos) / (b.pos - a.pos);
        return {
          r: Math.round(lerp(a.r, b.r, local)),
          g: Math.round(lerp(a.g, b.g, local)),
          b: Math.round(lerp(a.b, b.b, local))
        };
      }
    }
    return GRADIENT_STOPS[0];
  }

  function colorForSegment(i, len) {
    if (i === 0) return '#60a5fa';
    var t = i / Math.max(len - 1, 1);
    var gb = greenBlend();
    var baseR = Math.round(lerp(234, 220, t));
    var baseG = Math.round(lerp(179, 50, t));
    var baseB = Math.round(lerp(8, 38, t));
    if (gb > 0) {
      var c = sampleGradient(t);
      baseR = Math.round(lerp(baseR, c.r, gb));
      baseG = Math.round(lerp(baseG, c.g, gb));
      baseB = Math.round(lerp(baseB, c.b, gb));
    }
    return '#' + ((1 << 24) + (baseR << 16) + (baseG << 8) + baseB).toString(16).slice(1);
  }

  function glowForSegment(i, len) {
    if (i === 0) return 'rgba(96,165,250,0.5)';
    var t = i / Math.max(len - 1, 1);
    var gb = greenBlend();
    var baseR = Math.round(lerp(234, 220, t));
    var baseG = Math.round(lerp(179, 50, t));
    var baseB = Math.round(lerp(8, 38, t));
    if (gb > 0) {
      var c = sampleGradient(t);
      baseR = Math.round(lerp(baseR, c.r, gb));
      baseG = Math.round(lerp(baseG, c.g, gb));
      baseB = Math.round(lerp(baseB, c.b, gb));
    }
    return 'rgba(' + baseR + ',' + baseG + ',' + baseB + ',0.5)';
  }

  function blendHex(hexA, hexB, t) {
    var rA = parseInt(hexA.slice(1,3),16), gA = parseInt(hexA.slice(3,5),16), bA = parseInt(hexA.slice(5,7),16);
    var rB = parseInt(hexB.slice(1,3),16), gB = parseInt(hexB.slice(3,5),16), bB = parseInt(hexB.slice(5,7),16);
    var r = Math.round(lerp(rA, rB, t));
    var g = Math.round(lerp(gA, gB, t));
    var b = Math.round(lerp(bA, bB, t));
    return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  function render(now) {
    if (!alive && tickProgress >= 1) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      return;
    }

    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;

    var elapsed = now - lastTick;
    tickProgress = Math.min(elapsed / TICK_MS, 1);
    var ease = tickProgress * tickProgress * (3 - 2 * tickProgress);

    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#23272e';
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = '#2a2f3a';
    ctx.lineWidth = 0.5 * s;
    for (var c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * G * s, 0); ctx.lineTo(c * G * s, ch); ctx.stroke();
    }
    for (var r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * G * s); ctx.lineTo(cw, r * G * s); ctx.stroke();
    }

    var bubbleR = G * 0.44;
    var len = snake.length;
    var sinceAte = ateTime > 0 ? now - ateTime : 99999;
    var greenCol = '#22c55e';

    for (var i = len - 1; i >= 0; i--) {
      var cur = snake[i];
      var prev = prevSnake[i] || cur;
      var px = lerp(prev.x, cur.x, ease) * G + G / 2;
      var py = lerp(prev.y, cur.y, ease) * G + G / 2;

      var segAlpha = 1 - (i / len) * 0.4;
      var segR = bubbleR * (i === 0 ? 1.1 : (1 - (i / len) * 0.25));

      var col = colorForSegment(i, len);
      var glow = glowForSegment(i, len);
      var glowStr = i === 0 ? 0.8 : (0.5 - (i / len) * 0.3);

      var segDelay = i * CASCADE_STAGGER;
      var segElapsed = sinceAte - segDelay;
      if (segElapsed > 0 && segElapsed < CASCADE_DURATION) {
        var half = CASCADE_DURATION / 2;
        var greenT = segElapsed < half
          ? segElapsed / half
          : 1 - (segElapsed - half) / half;
        greenT = greenT * greenT * (3 - 2 * greenT);
        col = blendHex(col, greenCol, greenT * 0.85);
        glow = 'rgba(34,197,94,' + (0.5 * greenT).toFixed(2) + ')';
        glowStr = Math.max(glowStr, 0.7 * greenT);
        segR += 1.5 * greenT;
      }

      drawBubble(px, py, segR, col, glow, Math.max(0, glowStr), segAlpha);
    }

    animT += 0.04;
    var pulse = 0.5 + 0.5 * Math.sin(animT);
    var fcx = foodX * G + G / 2;
    var fcy = foodY * G + G / 2;
    var foodR = G * 0.48 + pulse * 2;

    drawBubble(fcx, fcy, foodR + 2, '#22c55e', 'rgba(34,197,94,0.6)', 0.6 + pulse * 0.4, 1);

    ctx.save();
    var label = currentCtrl[0];
    ctx.font = 'bold ' + Math.round(9 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText(label, fcx * s, fcy * s + 0.5 * s);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, fcx * s, fcy * s);
    ctx.restore();

    rafId = requestAnimationFrame(render);
  }

  function tick() {
    dirX = ndX; dirY = ndY;
    var nx = snake[0].x + dirX;
    var ny = snake[0].y + dirY;

    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { die(); return; }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { die(); return; }
    }

    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });

    snake.unshift({ x: nx, y: ny });

    if (nx === foodX && ny === foodY) {
      score++;
      justAte = true;
      ateTime = performance.now();
      if (scoreEl) scoreEl.textContent = String(score);
      if (ctrlEl) ctrlEl.textContent = currentCtrl[0];
      flash(currentCtrl);
      dropFood();
      prevSnake.unshift({ x: nx, y: ny });
    } else {
      snake.pop();
      justAte = false;
    }

    lastTick = performance.now();
    tickProgress = 0;
  }

  function die() {
    alive = false;
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;

    ctx.fillStyle = 'rgba(26,29,35,0.88)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = 'bold ' + Math.round(22 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#e4e6eb';
    ctx.fillText('Game Over', cw / 2, ch / 2 - 20 * s);

    ctx.font = 'bold ' + Math.round(14 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#60a5fa';
    var dieMsg = gameMode === 'controls' ? ' controls consumed' : ' ports consumed';
    ctx.fillText(score + dieMsg, cw / 2, ch / 2 + 10 * s);

    ctx.font = Math.round(12 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#6b7280';
    ctx.fillText('Press Start to play again', cw / 2, ch / 2 + 36 * s);
  }

  function startGame() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    initSnake();
    alive = true;
    lastTick = performance.now();
    tickProgress = 0;
    tickTimer = setInterval(tick, TICK_MS);
    rafId = requestAnimationFrame(render);
  }

  startBtn.addEventListener('click', startGame);

  function setDir(dir) {
    if (!alive) return;
    var oldNdX = ndX, oldNdY = ndY;
    if (dir === 'up'    && dirY !== 1)  { ndX = 0;  ndY = -1; }
    if (dir === 'down'  && dirY !== -1) { ndX = 0;  ndY = 1;  }
    if (dir === 'left'  && dirX !== 1)  { ndX = -1; ndY = 0;  }
    if (dir === 'right' && dirX !== -1) { ndX = 1;  ndY = 0;  }
    if ((ndX !== oldNdX || ndY !== oldNdY) && performance.now() - lastTick >= INPUT_THRESHOLD) {
      clearInterval(tickTimer);
      tick();
      tickTimer = setInterval(tick, TICK_MS);
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowUp'    || k === 'w' || k === 'W') setDir('up');
    else if (k === 'ArrowDown'  || k === 's' || k === 'S') setDir('down');
    else if (k === 'ArrowLeft'  || k === 'a' || k === 'A') setDir('left');
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir('right');
    if (k.indexOf('Arrow') === 0) e.preventDefault();
  });

  var dpad = document.getElementById('dpad');
  if (dpad) {
    var btns = dpad.querySelectorAll('.dpad-btn');
    for (var b = 0; b < btns.length; b++) {
      (function (btn) {
        var dir = btn.getAttribute('data-dir');

        btn.addEventListener('touchstart', function (e) {
          e.preventDefault();
          btn.classList.add('pressed');
          setDir(dir);
        }, { passive: false });

        btn.addEventListener('touchend', function (e) {
          e.preventDefault();
          btn.classList.remove('pressed');
        }, { passive: false });

        btn.addEventListener('mousedown', function (e) {
          e.preventDefault();
          btn.classList.add('pressed');
          setDir(dir);
        });

        btn.addEventListener('mouseup', function () {
          btn.classList.remove('pressed');
        });
        btn.addEventListener('mouseleave', function () {
          btn.classList.remove('pressed');
        });
      })(btns[b]);
    }
  }

  var swipeX0 = null, swipeY0 = null;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    swipeX0 = t.clientX;
    swipeY0 = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (swipeX0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - swipeX0;
    var dy = t.clientY - swipeY0;
    var minSwipe = 20;
    if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 'right' : 'left');
    } else {
      setDir(dy > 0 ? 'down' : 'up');
    }
    swipeX0 = null; swipeY0 = null;
  }, { passive: true });

  window.switchMode = function (mode) {
    if (mode === gameMode) return;
    gameMode = mode;
    var tabC = document.getElementById('tab-controls');
    var tabP = document.getElementById('tab-ports');
    if (tabC) tabC.classList.toggle('active', mode === 'controls');
    if (tabP) tabP.classList.toggle('active', mode === 'ports');
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    alive = false;
    initSnake();
    sizeCanvas();
    lastTick = performance.now();
    tickProgress = 1;
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    doInitialRender();
  };

  initSnake();
  sizeCanvas();
  lastTick = performance.now();
  tickProgress = 1;
  prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });

  function doInitialRender() {
    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#23272e';
    ctx.fillRect(0, 0, cw, ch);
    ctx.strokeStyle = '#2a2f3a';
    ctx.lineWidth = 0.5 * s;
    for (var c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * G * s, 0); ctx.lineTo(c * G * s, ch); ctx.stroke(); }
    for (var r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * G * s); ctx.lineTo(cw, r * G * s); ctx.stroke(); }
    var bubbleR = G * 0.44;
    for (var i = snake.length - 1; i >= 0; i--) {
      var px = snake[i].x * G + G / 2;
      var py = snake[i].y * G + G / 2;
      var segAlpha = 1 - (i / snake.length) * 0.4;
      var segR = bubbleR * (i === 0 ? 1.1 : (1 - (i / snake.length) * 0.25));
      drawBubble(px, py, segR, colorForSegment(i, snake.length), glowForSegment(i, snake.length), i === 0 ? 0.8 : 0.3, segAlpha);
    }
    var fcx = foodX * G + G / 2;
    var fcy = foodY * G + G / 2;
    drawBubble(fcx, fcy, G * 0.5, '#22c55e', 'rgba(34,197,94,0.6)', 0.6, 1);
    ctx.save();
    ctx.font = 'bold ' + Math.round(9 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(currentCtrl[0], fcx * s, fcy * s);
    ctx.restore();
  }
  doInitialRender();
});
  </script>
</body>
</html>
