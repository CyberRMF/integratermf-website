<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake - A NIST SP 800-53 Game from CyberRMF</title>
  <meta name="description" content="Eat the controls: a quick NIST SP 800-53 snake game from CyberRMF. Play with the arrow keys, WASD or a D-pad.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --bg:     #1a1d23;
      --bg2:    #23272e;
      --bg3:    #252830;
      --border: #3a3f4b;
      --text:   #e4e6eb;
      --muted:  #9ca3af;
      --dim:    #6b7280;
      --accent: #60a5fa;
      --mono:   'Consolas', 'Fira Code', 'SF Mono', 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { touch-action: manipulation; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; text-decoration: none; }

    .top-bar {
      width: 100%;
      max-width: 720px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-link {
      font-size: 12px;
      color: var(--muted);
      transition: color .2s;
    }
    .back-link:hover { color: var(--text); }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      padding: 0 12px;
      flex: 1;
    }
    .game-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .game-sub {
      font-size: 11px;
      color: var(--dim);
      margin-top: 2px;
      -webkit-font-smoothing: antialiased;
    }
    .flash-area {
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 6px 0;
    }
    .flash-id {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      opacity: 0;
      transition: opacity .15s;
      -webkit-font-smoothing: antialiased;
    }
    .flash-name {
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      transition: opacity .15s;
      -webkit-font-smoothing: antialiased;
    }
    .flash-id.show, .flash-name.show { opacity: 1; }

    .canvas-wrap {
      width: 100%;
      position: relative;
    }
    #snake-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .score {
      font-size: 13px;
      color: var(--muted);
      -webkit-font-smoothing: antialiased;
    }
    .score strong { color: var(--accent); }
    .btn {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 24px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      transition: border-color .2s;
      -webkit-font-smoothing: antialiased;
    }
    .btn:hover { border-color: var(--muted); }

    /* ── Game Tabs ── */
    .game-tabs {
      display: flex;
      gap: 0;
      margin: 8px 0 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .game-tab {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 18px;
      background: transparent;
      border: none;
      color: var(--dim);
      cursor: pointer;
      transition: color .2s, background .2s;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    .game-tab:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: var(--border);
    }
    .game-tab:hover { color: var(--muted); }
    .game-tab.active {
      color: var(--accent);
      background: rgba(96,165,250,0.08);
    }
    .game-tab:disabled {
      cursor: not-allowed;
      opacity: .45;
    }
    .game-tab:disabled:not(.active):hover { color: var(--dim); }
    .tab-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── D-pad ── */
    .dpad {
      display: none;
      width: 180px;
      height: 180px;
      position: relative;
      margin: 12px auto 20px;
      flex-shrink: 0;
    }
    .dpad-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background .1s, border-color .1s;
      touch-action: manipulation;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      background: rgba(96,165,250,0.15);
      border-color: var(--accent);
    }
    .dpad-btn svg {
      width: 22px;
      height: 22px;
      fill: var(--muted);
      transition: fill .1s;
    }
    .dpad-btn:active svg, .dpad-btn.pressed svg { fill: var(--accent); }
    .dpad-up    { top: 0;   left: 50%; transform: translateX(-50%); }
    .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dpad-left  { left: 0;  top: 50%;  transform: translateY(-50%); }
    .dpad-right { right: 0; top: 50%;  transform: translateY(-50%); }
    .dpad.third .dpad-up, .dpad.third .dpad-down { opacity: .3; pointer-events: none; }

    @media (max-width: 600px), (pointer: coarse) {
      .dpad { display: block; }
      .game-sub { font-size: 10px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="https://integratermf.com" class="back-link">&larr; Back to site</a>
  </div>

  <div class="game-wrap">
    <div style="text-align:center">
      <div class="game-title">NIST SP 800-53 Snake</div>
      <div class="game-sub" id="game-sub">Eat the controls. Arrow keys, WASD, or D-pad.</div>
    </div>
    <div class="tab-row">
      <div class="game-tabs">
        <button class="game-tab active" id="tab-controls" onclick="switchMode('controls')">800-53 Controls</button>
        <button class="game-tab" id="tab-ports" onclick="switchMode('ports')">Ports &amp; Protocols</button>
      </div>
      <div class="game-tabs" id="view-tabs">

        <button class="game-tab" id="view-third" onclick="switchView('third')">3rd Person</button>
      </div>
    </div>
    <div class="flash-area">
      <span class="flash-id" id="flash-id"></span>
      <span class="flash-name" id="flash-name"></span>
    </div>
    <div class="canvas-wrap">
      <canvas id="snake-canvas"></canvas>
    </div>
    <div class="hud">
      <span class="score">Score: <strong id="snake-score">0</strong></span>
      <span class="score"><span id="hud-label">Control</span>: <strong id="snake-ctrl">-</strong></span>
      <button class="btn" id="snake-start">Start</button>
    </div>

    <div class="dpad" id="dpad">
      <div class="dpad-btn dpad-up" data-dir="up">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
      </div>
      <div class="dpad-btn dpad-down" data-dir="down">
        <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>
      </div>
      <div class="dpad-btn dpad-left" data-dir="left">
        <svg viewBox="0 0 24 24"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
      </div>
      <div class="dpad-btn dpad-right" data-dir="right">
        <svg viewBox="0 0 24 24"><path d="M20 12l-8 8v-5H4v-6h8V4z"/></svg>
      </div>
    </div>
  </div>

  <script>
window.addEventListener('DOMContentLoaded', function () {
  var canvas = document.getElementById('snake-canvas');
  var startBtn = document.getElementById('snake-start');
  var scoreEl = document.getElementById('snake-score');
  var ctrlEl = document.getElementById('snake-ctrl');
  var flashIdEl = document.getElementById('flash-id');
  var flashNameEl = document.getElementById('flash-name');
  if (!canvas || !startBtn) return;

  var ctx = canvas.getContext('2d');

  var BASE_W = 700;
  var BASE_H = 560;
  var G = 20;
  var COLS = BASE_W / G;
  var ROWS = BASE_H / G;
  var TICK_MS = 80;
  var INPUT_THRESHOLD = 25;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);

  function sizeCanvas() {
    var wrap = canvas.parentElement;
    var cw = wrap.clientWidth;
    var aspect = BASE_W / BASE_H;
    var drawW = cw;
    var drawH = Math.round(cw / aspect);
    canvas.style.width = drawW + 'px';
    canvas.style.height = drawH + 'px';
    canvas.width = Math.round(drawW * dpr);
    canvas.height = Math.round(drawH * dpr);
  }
  sizeCanvas();
  window.addEventListener('resize', function () { sizeCanvas(); });

  function S() { return canvas.width / BASE_W; }

  var CONTROLS = [
    ['AC-1','Policy and Procedures'],['AC-2','Account Management'],['AC-3','Access Enforcement'],
    ['AC-4','Information Flow Enforcement'],['AC-5','Separation of Duties'],['AC-6','Least Privilege'],
    ['AC-7','Unsuccessful Logon Attempts'],['AC-8','System Use Notification'],['AC-11','Device Lock'],
    ['AC-17','Remote Access'],['AC-18','Wireless Access'],['AC-19','Access Control for Mobile Devices'],
    ['AC-20','Use of External Systems'],['AC-22','Publicly Accessible Content'],
    ['AT-1','Policy and Procedures'],['AT-2','Literacy Training and Awareness'],['AT-3','Role-Based Training'],
    ['AU-1','Policy and Procedures'],['AU-2','Event Logging'],['AU-3','Content of Audit Records'],
    ['AU-4','Audit Log Storage Capacity'],['AU-5','Response to Audit Logging Failures'],
    ['AU-6','Audit Record Review, Analysis, and Reporting'],['AU-8','Time Stamps'],

    ['CA-1','Policy and Procedures'],['CA-2','Control Assessments'],['CA-3','Information Exchange'],
    ['CA-5','Plan of Action and Milestones'],['CA-6','Authorization'],['CA-7','Continuous Monitoring'],
    ['CA-9','Internal System Connections'],['CM-1','Policy and Procedures'],['CM-2','Baseline Configuration'],
    ['CM-3','Configuration Change Control'],['CM-4','Impact Analyses'],['CM-5','Access Restrictions for Change'],
    ['CM-6','Configuration Settings'],['CM-7','Least Functionality'],['CM-8','System Component Inventory'],
    ['CM-9','Configuration Management Plan'],['CM-10','Software Usage Restrictions'],['CM-11','User-Installed Software'],
    ['CP-1','Policy and Procedures'],['CP-2','Contingency Plan'],['CP-3','Contingency Training'],
    ['CP-4','Contingency Plan Testing'],['CP-9','System Backup'],['CP-10','System Recovery and Reconstitution'],
    ['IA-1','Policy and Procedures'],['IA-2','Identification and Authentication'],
    ['IA-3','Device Identification and Authentication'],['IA-4','Identifier Management'],
    ['IA-5','Authenticator Management'],['IA-6','Authentication Feedback'],
    ['IA-8','Identification and Authentication (Non-Org Users)'],['IR-1','Policy and Procedures'],
    ['IR-2','Incident Response Training'],['IR-4','Incident Handling'],['IR-5','Incident Monitoring'],
    ['IR-6','Incident Reporting'],['IR-8','Incident Response Plan'],['MA-1','Policy and Procedures'],
    ['MA-2','Controlled Maintenance'],['MA-3','Maintenance Tools'],['MA-5','Maintenance Personnel'],
    ['MP-1','Policy and Procedures'],['MP-2','Media Access'],['MP-6','Media Sanitization'],['MP-7','Media Use'],
    ['PE-1','Policy and Procedures'],['PE-2','Physical Access Authorizations'],['PE-3','Physical Access Control'],
    ['PE-6','Monitoring Physical Access'],['PE-8','Visitor Access Records'],['PE-12','Emergency Lighting'],
    ['PE-13','Fire Protection'],['PE-14','Environmental Controls'],['PE-15','Water Damage Protection'],
    ['PE-16','Delivery and Removal'],['PL-1','Policy and Procedures'],['PL-2','System Security and Privacy Plans'],
    ['PL-4','Rules of Behavior'],['PM-1','Information Security Program Plan'],
    ['PM-2','Information Security Program Leadership Role'],['PM-5','System Inventory'],
    ['PM-6','Measures of Performance'],['PM-9','Risk Management Strategy'],['PM-10','Authorization Process'],
    ['PS-1','Policy and Procedures'],['PS-2','Position Risk Designation'],['PS-3','Personnel Screening'],
    ['PS-4','Personnel Termination'],['PS-5','Personnel Transfer'],['PS-6','Access Agreements'],
    ['PS-7','External Personnel Security'],['PS-8','Personnel Sanctions'],['RA-1','Policy and Procedures'],
    ['RA-2','Security Categorization'],['RA-3','Risk Assessment'],['RA-5','Vulnerability Monitoring and Scanning'],
    ['SA-1','Policy and Procedures'],['SA-2','Allocation of Resources'],['SA-3','System Development Life Cycle'],
    ['SA-4','Acquisition Process'],['SA-5','System Documentation'],['SA-9','External System Services'],
    ['SC-1','Policy and Procedures'],['SC-2','Separation of System and User Functionality'],
    ['SC-4','Information in Shared System Resources'],['SC-5','Denial-of-Service Protection'],
    ['SC-7','Boundary Protection'],['SC-8','Transmission Confidentiality and Integrity'],
    ['SC-10','Network Disconnect'],['SC-12','Cryptographic Key Establishment and Management'],
    ['SC-13','Cryptographic Protection'],['SC-15','Collaborative Computing Devices and Applications'],
    ['SC-20','Secure Name/Address Resolution Service'],
    ['SC-21','Secure Name/Address Resolution Service (Recursive)'],
    ['SC-22','Architecture and Provisioning for Name/Address Resolution'],
    ['SC-28','Protection of Information at Rest'],['SC-39','Process Isolation'],
    ['SI-1','Policy and Procedures'],['SI-2','Flaw Remediation'],['SI-3','Malicious Code Protection'],
    ['SI-4','System Monitoring'],['SI-5','Security Alerts, Advisories, and Directives'],
    ['SI-12','Information Management and Retention'],['SR-1','Policy and Procedures'],
    ['SR-2','Supply Chain Risk Management Plan'],['SR-3','Supply Chain Controls and Processes']
  ];

  var PORTS = [
    ['7','ECHO'],['19','CHARGEN'],['20','FTP-Data'],['21','FTP'],['22','SSH'],
    ['23','Telnet'],['25','SMTP'],['42','WINS Replication'],['43','WHOIS'],['53','DNS'],
    ['66','Oracle SQL*Net'],['67','DHCP/BOOTP Server'],['68','DHCP/BOOTP Client'],
    ['69','TFTP'],['70','Gopher'],['79','Finger'],['80','HTTP'],['88','Kerberos'],
    ['110','POP3'],['111','SunRPC / Portmap'],['113','IDENT / Auth'],['119','NNTP'],
    ['123','NTP'],['135','MSRPC / EPMAP'],['137','NetBIOS Name Service'],
    ['138','NetBIOS Datagram'],['139','NetBIOS Session / SMB'],['143','IMAP'],
    ['161','SNMP'],['162','SNMP Trap'],['177','XDMCP'],['179','BGP'],['194','IRC'],
    ['201','AppleTalk'],['264','BGMP'],['318','TSP'],['381','HP OpenView NNM'],
    ['383','HP OpenView Data'],['389','LDAP'],['411','Direct Connect Hub'],
    ['412','Direct Connect C2S'],['427','SLP'],['443','HTTPS'],['445','SMB / CIFS'],
    ['464','Kerberos Change/Set Password'],['465','SMTPS'],['497','Retrospect'],
    ['500','ISAKMP / IKE'],['512','Rexec'],['513','Rlogin'],['514','RSH / Syslog'],
    ['515','LPD / Line Printer'],['520','RIP'],['521','RIPng'],['540','UUCP'],
    ['546','DHCPv6 Client'],['547','DHCPv6 Server'],['548','AFP'],['554','RTSP'],
    ['560','RMonitor'],['563','NNTPS'],['587','SMTP Submission'],['591','FileMaker'],
    ['593','DCOM / HTTP RPC'],['631','IPP / CUPS'],['636','LDAPS'],['639','MSDP'],
    ['646','LDP'],['691','MS Exchange Routing'],['860','iSCSI'],['873','Rsync'],
    ['902','VMware Server'],['989','FTPS Data'],['990','FTPS Control'],
    ['993','IMAPS'],['995','POP3S']
  ];

  var gameMode = 'controls';
  function activeData() { return gameMode === 'controls' ? CONTROLS : PORTS; }

  var ctrlIdx = 0;
  var snake = [];
  var prevSnake = [];
  var dirX = 1, dirY = 0;
  var ndX = 1, ndY = 0;
  var foodX = 5, foodY = 5;
  var currentCtrl = CONTROLS[0];
  var score = 0;
  var alive = false;
  var tickTimer = null;
  var animT = 0;
  var lastTick = 0;
  var tickProgress = 1;
  var rafId = null;
  var justAte = false;
  var ateTime = 0;
  var CASCADE_DURATION = 180;
  var CASCADE_STAGGER = 35;
  var THIRD_TICK_MS = 140;
  var view = 'birds';
  var turnQueue = [];
  var camYaw = 0;
  var lastFrame = 0;
  var answer = '';

  function tickMs() { return view === 'third' ? THIRD_TICK_MS : TICK_MS; }

  function shuffle() {
    var data = activeData();
    for (var i = data.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = data[i]; data[i] = data[j]; data[j] = tmp;
    }
    ctrlIdx = 0;
  }

  function nextCtrl() {
    var data = activeData();
    if (ctrlIdx >= data.length) shuffle();
    currentCtrl = data[ctrlIdx++];
    return currentCtrl;
  }

  function flash(ctrl) {
    if (flashIdEl && flashNameEl) {
      flashIdEl.textContent = ctrl[0];
      flashNameEl.textContent = ctrl[1];
      flashIdEl.classList.add('show');
      flashNameEl.classList.add('show');
    }
  }

  var hudLabelEl = document.getElementById('hud-label');

  function initSnake() {
    var mx = Math.floor(COLS / 2);
    var my = Math.floor(ROWS / 2);
    snake = [{ x: mx, y: my }, { x: mx - 1, y: my }, { x: mx - 2, y: my }];
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    dirX = 1; dirY = 0; ndX = 1; ndY = 0;
    score = 0; animT = 0; justAte = false;
    answer = ''; turnQueue = []; camYaw = Math.atan2(dirY, dirX); lastFrame = 0;
    if (scoreEl) scoreEl.textContent = '0';
    if (ctrlEl) ctrlEl.textContent = '-';
    if (hudLabelEl) hudLabelEl.textContent = gameMode === 'controls' ? 'Control' : 'Port';
    if (flashIdEl) flashIdEl.classList.remove('show');
    if (flashNameEl) flashNameEl.classList.remove('show');
    shuffle();
    dropFood();
  }

  function dropFood() {
    var fx, fy, ok, i;
    do {
      ok = true;
      fx = Math.floor(Math.random() * COLS);
      fy = Math.floor(Math.random() * ROWS);
      for (i = 0; i < snake.length; i++) {
        if (snake[i].x === fx && snake[i].y === fy) { ok = false; break; }
      }
    } while (!ok);
    foodX = fx; foodY = fy;
    nextCtrl();
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawBubble(cx, cy, r, color, glowColor, glowStrength, alpha) {
    var s = S();
    drawBall(cx * s, cy * s, r * s, color, glowColor, glowStrength, alpha, 6 * s);
  }

  function drawBall(cx, cy, r, color, glowColor, glowStrength, alpha, glowPad) {
    ctx.save();
    ctx.globalAlpha = alpha;

    if (glowStrength > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r + glowPad, 0, Math.PI * 2);
      ctx.fillStyle = glowColor;
      ctx.globalAlpha = alpha * glowStrength * 0.35;
      ctx.fill();
      ctx.globalAlpha = alpha;
    }

    var grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    grad.addColorStop(0, lightenColor(color, 40));
    grad.addColorStop(0.6, color);
    grad.addColorStop(1, darkenColor(color, 30));
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx - r * 0.25, cy - r * 0.3, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();

    ctx.restore();
  }

  function lightenColor(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function darkenColor(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function greenBlend() {
    if (score < 30) return 0;
    return Math.min((score - 30) / 40, 1);
  }

  var GRADIENT_STOPS = [
    { pos: 0,    r: 220, g: 50,  b: 38  },
    { pos: 0.25, r: 234, g: 130, b: 8   },
    { pos: 0.5,  r: 234, g: 200, b: 30  },
    { pos: 0.75, r: 34,  g: 197, b: 94  },
    { pos: 1,    r: 22,  g: 120, b: 50  }
  ];

  function sampleGradient(t) {
    if (t <= 0) return GRADIENT_STOPS[0];
    if (t >= 1) return GRADIENT_STOPS[GRADIENT_STOPS.length - 1];
    for (var i = 0; i < GRADIENT_STOPS.length - 1; i++) {
      var a = GRADIENT_STOPS[i], b = GRADIENT_STOPS[i + 1];
      if (t >= a.pos && t <= b.pos) {
        var local = (t - a.pos) / (b.pos - a.pos);
        return {
          r: Math.round(lerp(a.r, b.r, local)),
          g: Math.round(lerp(a.g, b.g, local)),
          b: Math.round(lerp(a.b, b.b, local))
        };
      }
    }
    return GRADIENT_STOPS[0];
  }

  function colorForSegment(i, len) {
    if (i === 0) return '#60a5fa';
    var t = i / Math.max(len - 1, 1);
    var gb = greenBlend();
    var baseR = Math.round(lerp(234, 220, t));
    var baseG = Math.round(lerp(179, 50, t));
    var baseB = Math.round(lerp(8, 38, t));
    if (gb > 0) {
      var c = sampleGradient(t);
      baseR = Math.round(lerp(baseR, c.r, gb));
      baseG = Math.round(lerp(baseG, c.g, gb));
      baseB = Math.round(lerp(baseB, c.b, gb));
    }
    return '#' + ((1 << 24) + (baseR << 16) + (baseG << 8) + baseB).toString(16).slice(1);
  }

  function glowForSegment(i, len) {
    if (i === 0) return 'rgba(96,165,250,0.5)';
    var t = i / Math.max(len - 1, 1);
    var gb = greenBlend();
    var baseR = Math.round(lerp(234, 220, t));
    var baseG = Math.round(lerp(179, 50, t));
    var baseB = Math.round(lerp(8, 38, t));
    if (gb > 0) {
      var c = sampleGradient(t);
      baseR = Math.round(lerp(baseR, c.r, gb));
      baseG = Math.round(lerp(baseG, c.g, gb));
      baseB = Math.round(lerp(baseB, c.b, gb));
    }
    return 'rgba(' + baseR + ',' + baseG + ',' + baseB + ',0.5)';
  }

  function blendHex(hexA, hexB, t) {
    var rA = parseInt(hexA.slice(1,3),16), gA = parseInt(hexA.slice(3,5),16), bA = parseInt(hexA.slice(5,7),16);
    var rB = parseInt(hexB.slice(1,3),16), gB = parseInt(hexB.slice(3,5),16), bB = parseInt(hexB.slice(5,7),16);
    var r = Math.round(lerp(rA, rB, t));
    var g = Math.round(lerp(gA, gB, t));
    var b = Math.round(lerp(bA, bB, t));
    return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  function segmentStyle(i, len, sinceAte) {
    var col = colorForSegment(i, len);
    var glow = glowForSegment(i, len);
    var glowStr = i === 0 ? 0.8 : (0.5 - (i / len) * 0.3);
    var grow = 0;

    var segDelay = i * CASCADE_STAGGER;
    var segElapsed = sinceAte - segDelay;
    if (segElapsed > 0 && segElapsed < CASCADE_DURATION) {
      var half = CASCADE_DURATION / 2;
      var greenT = segElapsed < half
        ? segElapsed / half
        : 1 - (segElapsed - half) / half;
      greenT = greenT * greenT * (3 - 2 * greenT);
      col = blendHex(col, '#22c55e', greenT * 0.85);
      glow = 'rgba(34,197,94,' + (0.5 * greenT).toFixed(2) + ')';
      glowStr = Math.max(glowStr, 0.7 * greenT);
      grow = 1.5 * greenT;
    }
    return { col: col, glow: glow, glowStr: Math.max(0, glowStr), grow: grow };
  }

  function tagFont(px) { return 'bold ' + Math.round(px) + 'px -apple-system, "Segoe UI", Consolas, monospace'; }

  function tagWidth(text, px) {
    ctx.save();
    ctx.font = tagFont(px);
    var w = ctx.measureText(text).width + px * 1.2;
    ctx.restore();
    return w;
  }

  function pillPath(x, y, w, h) {
    var r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
  }

  // align is the side of the tag that sits at x ('left', 'right' or 'center'); y is its vertical middle.
  function drawTag(text, x, y, align, px, border) {
    var w = tagWidth(text, px);
    var h = px * 1.8;
    var left = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
    left = Math.max(2, Math.min(canvas.width - w - 2, left));
    ctx.save();
    pillPath(left, y - h / 2, w, h);
    ctx.fillStyle = 'rgba(17,19,24,0.85)';
    ctx.fill();
    ctx.lineWidth = Math.max(1, px * 0.1);
    ctx.strokeStyle = border;
    ctx.stroke();
    ctx.font = tagFont(px);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e4e6eb';
    ctx.fillText(text, left + w / 2, y + px * 0.05);
    ctx.restore();
  }

  function render(now) {
    if (!alive && tickProgress >= 1) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      return;
    }

    tickProgress = Math.min((now - lastTick) / tickMs(), 1);
    animT += 0.04;
    if (view === 'third') drawThird(now); else drawBirds(now);

    rafId = requestAnimationFrame(render);
  }

  function drawBirds(now) {
    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;

    var ease = tickProgress * tickProgress * (3 - 2 * tickProgress);

    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#23272e';
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = '#2a2f3a';
    ctx.lineWidth = 0.5 * s;
    for (var c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * G * s, 0); ctx.lineTo(c * G * s, ch); ctx.stroke();
    }
    for (var r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * G * s); ctx.lineTo(cw, r * G * s); ctx.stroke();
    }

    var bubbleR = G * 0.44;
    var len = snake.length;
    var sinceAte = ateTime > 0 ? now - ateTime : 99999;

    for (var i = len - 1; i >= 0; i--) {
      var cur = snake[i];
      var prev = prevSnake[i] || cur;
      var px = lerp(prev.x, cur.x, ease) * G + G / 2;
      var py = lerp(prev.y, cur.y, ease) * G + G / 2;

      var segAlpha = 1 - (i / len) * 0.4;
      var segR = bubbleR * (i === 0 ? 1.1 : (1 - (i / len) * 0.25));
      var st = segmentStyle(i, len, sinceAte);

      drawBubble(px, py, segR + st.grow, st.col, st.glow, st.glowStr, segAlpha);
    }

    var pulse = 0.5 + 0.5 * Math.sin(animT);
    var fcx = foodX * G + G / 2;
    var fcy = foodY * G + G / 2;
    var foodR = G * 0.48 + pulse * 2;

    drawBubble(fcx, fcy, foodR + 2, '#22c55e', 'rgba(34,197,94,0.6)', 0.6 + pulse * 0.4, 1);

    ctx.save();
    var label = currentCtrl[0];
    ctx.font = 'bold ' + Math.round(9 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText(label, fcx * s, fcy * s + 0.5 * s);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, fcx * s, fcy * s);
    ctx.restore();

    drawAnswerBeside(ease);
  }

  function drawAnswerBeside(ease) {
    if (!answer) return;
    var s = S();
    var head = snake[0], prev = prevSnake[0] || head;
    var hx = (lerp(prev.x, head.x, ease) * G + G / 2) * s;
    var hy = (lerp(prev.y, head.y, ease) * G + G / 2) * s;
    var gap = (G * 0.44 * 1.1 + 5) * s;
    var px = 11 * s;
    var border = 'rgba(96,165,250,0.7)';
    if (hx + gap + tagWidth(answer, px) <= canvas.width - 2) {
      drawTag(answer, hx + gap, hy, 'left', px, border);
      return;
    }
    // No room on the right: sit above the head, or below it when the body trails above.
    var h = px * 1.8, off = gap + h / 2 - 2 * s;
    var up = dirY !== 1;
    if (up && hy - off - h / 2 < 0) up = false;
    else if (!up && hy + off + h / 2 > canvas.height) up = true;
    drawTag(answer, hx, up ? hy - off : hy + off, 'center', px, border);
  }

  // 3rd person: world units are grid cells, the board lies on y = 0 from (0, 0) to (COLS, ROWS),
  // and the camera rides just behind and above the head, turning with it.
  var CAM_BACK = 3.2, CAM_UP = 2.9, LOOK_AHEAD = 4, LOOK_UP = 0.3, NEAR = 0.15, WALL_H = 0.7;
  var cam = null;

  function setCamera(hx, hz) {
    var fx = Math.cos(camYaw), fz = Math.sin(camYaw);
    var vx = fx * (CAM_BACK + LOOK_AHEAD), vy = LOOK_UP - CAM_UP, vz = fz * (CAM_BACK + LOOK_AHEAD);
    var vl = Math.sqrt(vx * vx + vy * vy + vz * vz);
    vx /= vl; vy /= vl; vz /= vl;
    var rl = Math.sqrt(vx * vx + vz * vz);
    var rx = -vz / rl, rz = vx / rl;
    cam = {
      x: hx - fx * CAM_BACK, y: CAM_UP, z: hz - fz * CAM_BACK,
      fx: vx, fy: vy, fz: vz,
      rx: rx, rz: rz,
      ux: -rz * vy, uy: rz * vx - rx * vz, uz: rx * vy,
      hx: fx, hz: fz,
      f: canvas.height * 0.95, cx: canvas.width / 2, cy: canvas.height / 2
    };
  }

  function toCam(x, y, z) {
    var dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    return {
      x: dx * cam.rx + dz * cam.rz,
      y: dx * cam.ux + dy * cam.uy + dz * cam.uz,
      z: dx * cam.fx + dy * cam.fy + dz * cam.fz
    };
  }

  function proj(c) { return { x: cam.cx + c.x * cam.f / c.z, y: cam.cy - c.y * cam.f / c.z }; }

  function lerpCam(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t) }; }

  function clipNear(pts) {
    var out = [];
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      var aIn = a.z >= NEAR, bIn = b.z >= NEAR;
      if (aIn) out.push(a);
      if (aIn !== bIn) out.push(lerpCam(a, b, (NEAR - a.z) / (b.z - a.z)));
    }
    return out;
  }

  function fillWorldPoly(world, style) {
    var pts = clipNear(world.map(function (p) { return toCam(p[0], p[1], p[2]); }));
    if (pts.length < 3) return;
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var p = proj(pts[i]);
      if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = style;
    ctx.fill();
  }

  function worldLine(a, b) {
    var ca = toCam(a[0], a[1], a[2]), cb = toCam(b[0], b[1], b[2]);
    if (ca.z < NEAR && cb.z < NEAR) return;
    if (ca.z < NEAR) ca = lerpCam(ca, cb, (NEAR - ca.z) / (cb.z - ca.z));
    else if (cb.z < NEAR) cb = lerpCam(cb, ca, (NEAR - cb.z) / (ca.z - cb.z));
    var pa = proj(ca), pb = proj(cb);
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
  }

  function drawThird(now) {
    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;
    var t = tickProgress;

    var dt = lastFrame ? Math.min(now - lastFrame, 100) : 0;
    lastFrame = now;
    var turnBy = Math.atan2(dirY, dirX) - camYaw;
    while (turnBy > Math.PI) turnBy -= Math.PI * 2;
    while (turnBy < -Math.PI) turnBy += Math.PI * 2;
    camYaw += dt ? turnBy * (1 - Math.exp(-dt / 110)) : turnBy;

    var head = snake[0], headPrev = prevSnake[0] || head;
    setCamera(lerp(headPrev.x, head.x, t) + 0.5, lerp(headPrev.y, head.y, t) + 0.5);

    var horizon = cam.cy - (cam.hx * cam.ux + cam.hz * cam.uz) / (cam.hx * cam.fx + cam.hz * cam.fz) * cam.f;
    var sky = ctx.createLinearGradient(0, 0, 0, Math.max(horizon, 1));
    sky.addColorStop(0, '#0f1115');
    sky.addColorStop(1, '#1f232a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#15171c';
    ctx.fillRect(0, Math.max(0, horizon), cw, ch);

    fillWorldPoly([[0, 0, 0], [COLS, 0, 0], [COLS, 0, ROWS], [0, 0, ROWS]], '#23272e');
    ctx.beginPath();
    for (var c = 0; c <= COLS; c++) worldLine([c, 0, 0], [c, 0, ROWS]);
    for (var r = 0; r <= ROWS; r++) worldLine([0, 0, r], [COLS, 0, r]);
    ctx.strokeStyle = '#323844';
    ctx.lineWidth = 1 * s;
    ctx.stroke();

    var walls = [
      [[0, 0, 0], [COLS, 0, 0]], [[COLS, 0, 0], [COLS, 0, ROWS]],
      [[COLS, 0, ROWS], [0, 0, ROWS]], [[0, 0, ROWS], [0, 0, 0]]
    ].map(function (w) {
      return { a: w[0], b: w[1], d: toCam((w[0][0] + w[1][0]) / 2, 0, (w[0][2] + w[1][2]) / 2).z };
    }).sort(function (p, q) { return q.d - p.d; });
    walls.forEach(function (w) {
      fillWorldPoly([w.a, w.b, [w.b[0], WALL_H, w.b[2]], [w.a[0], WALL_H, w.a[2]]], '#3a3f4b');
      ctx.beginPath();
      worldLine([w.a[0], WALL_H, w.a[2]], [w.b[0], WALL_H, w.b[2]]);
      ctx.strokeStyle = 'rgba(96,165,250,0.8)';
      ctx.lineWidth = 2 * s;
      ctx.stroke();
    });

    var fog = ctx.createLinearGradient(0, horizon, 0, horizon + ch * 0.2);
    fog.addColorStop(0, 'rgba(31,35,42,0.95)');
    fog.addColorStop(1, 'rgba(31,35,42,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, horizon, cw, ch * 0.2);

    var items = [];
    var len = snake.length;
    var sinceAte = ateTime > 0 ? now - ateTime : 99999;
    for (var i = 0; i < len; i++) {
      var cur = snake[i], prev = prevSnake[i] || cur;
      var st = segmentStyle(i, len, sinceAte);
      var segR = (i === 0 ? 0.48 : 0.44 * (1 - (i / len) * 0.25)) + st.grow / G;
      items.push({ x: lerp(prev.x, cur.x, t) + 0.5, y: segR, z: lerp(prev.y, cur.y, t) + 0.5, r: segR,
                   col: st.col, glow: st.glow, glowStr: st.glowStr });
    }
    var headItem = items[0];
    var pulse = 0.5 + 0.5 * Math.sin(animT);
    var foodR = 0.46 + pulse * 0.05;
    var food = { x: foodX + 0.5, y: foodR + 0.1 + pulse * 0.12, z: foodY + 0.5, r: foodR,
                 col: '#22c55e', glow: 'rgba(34,197,94,0.6)', glowStr: 0.6 + pulse * 0.4 };
    items.push(food);

    ctx.beginPath();
    items.forEach(function (it) {
      var pts = [];
      for (var k = 0; k < 16; k++) {
        var a = k / 16 * Math.PI * 2;
        var p = toCam(it.x + 0.06 + Math.cos(a) * it.r * 0.95, 0, it.z + 0.06 + Math.sin(a) * it.r * 0.95);
        if (p.z < NEAR) return;
        pts.push(proj(p));
      }
      ctx.moveTo(pts[0].x, pts[0].y);
      for (k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
      ctx.closePath();
    });
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fill();

    items.forEach(function (it) {
      it.c = toCam(it.x, it.y, it.z);
      if (it.c.z < NEAR + it.r) return;
      var p = proj(it.c);
      it.sx = p.x; it.sy = p.y; it.sr = it.r * cam.f / it.c.z;
    });
    items.slice().sort(function (p, q) { return q.c.z - p.c.z; }).forEach(function (it) {
      if (!it.sr) return;
      var hidesHead = it !== headItem && it.c.z < headItem.c.z &&
        Math.hypot(it.sx - headItem.sx, it.sy - headItem.sy) < it.sr + headItem.sr;
      drawBall(it.sx, it.sy, it.sr, it.col, it.glow, it.glowStr, hidesHead ? 0.45 : 1, it.sr * 0.2);
    });

    var foodSeen = food.sr && food.sx > 0 && food.sx < cw && food.sy > 0 && food.sy < ch;
    if (foodSeen) {
      var fpx = Math.max(10 * s, Math.min(15 * s, food.sr * 0.7));
      drawTag(currentCtrl[0], food.sx, food.sy - food.sr - fpx * 0.9 - 3 * s, 'center', fpx, 'rgba(34,197,94,0.7)');
    } else {
      var dx = food.x - cam.x, dz = food.z - cam.z;
      var onLeft = dx * cam.rx + dz * cam.rz < 0;
      var ax = onLeft ? 14 * s : cw - 14 * s, ay = ch * 0.55;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ax + (onLeft ? -8 : 8) * s, ay);
      ctx.lineTo(ax + (onLeft ? 4 : -4) * s, ay - 9 * s);
      ctx.lineTo(ax + (onLeft ? 4 : -4) * s, ay + 9 * s);
      ctx.closePath();
      ctx.fillStyle = 'rgba(34,197,94,0.9)';
      ctx.fill();
      ctx.restore();
      drawTag(currentCtrl[0], ax + (onLeft ? 10 : -10) * s, ay, onLeft ? 'left' : 'right', 11 * s, 'rgba(34,197,94,0.7)');
    }

    if (answer && headItem.sr) {
      var ap = proj(toCam(headItem.x, headItem.y + headItem.r + 0.3, headItem.z));
      drawTag(answer, ap.x, ap.y, 'center', 13 * s, 'rgba(96,165,250,0.7)');
    }
  }

  function tick() {
    if (view === 'third') {
      var turn = turnQueue.shift();
      var oldX = dirX;
      if (turn === 'left') { dirX = dirY; dirY = -oldX; }
      else if (turn === 'right') { dirX = -dirY; dirY = oldX; }
      ndX = dirX; ndY = dirY;
    } else {
      dirX = ndX; dirY = ndY;
    }
    var nx = snake[0].x + dirX;
    var ny = snake[0].y + dirY;

    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { die(); return; }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { die(); return; }
    }

    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });

    snake.unshift({ x: nx, y: ny });

    if (nx === foodX && ny === foodY) {
      score++;
      justAte = true;
      ateTime = performance.now();
      if (scoreEl) scoreEl.textContent = String(score);
      if (ctrlEl) ctrlEl.textContent = currentCtrl[0];
      flash(currentCtrl);
      answer = currentCtrl[1];
      dropFood();
      prevSnake.unshift(view === 'third' ? { x: prevSnake[0].x, y: prevSnake[0].y } : { x: nx, y: ny });
    } else {
      snake.pop();
      justAte = false;
    }

    lastTick = performance.now();
    tickProgress = 0;
  }

  function die() {
    alive = false;
    lockView(false);
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;

    ctx.fillStyle = 'rgba(26,29,35,0.88)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = 'bold ' + Math.round(22 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#e4e6eb';
    ctx.fillText('Game Over', cw / 2, ch / 2 - 20 * s);

    ctx.font = 'bold ' + Math.round(14 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#60a5fa';
    var dieMsg = gameMode === 'controls' ? ' controls consumed' : ' ports consumed';
    ctx.fillText(score + dieMsg, cw / 2, ch / 2 + 10 * s);

    ctx.font = Math.round(12 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.fillStyle = '#6b7280';
    ctx.fillText('Press Start to play again', cw / 2, ch / 2 + 36 * s);
  }

  function startGame() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    initSnake();
    alive = true;
    lockView(true);
    lastTick = performance.now();
    tickProgress = 0;
    tickTimer = setInterval(tick, tickMs());
    rafId = requestAnimationFrame(render);
  }

  startBtn.addEventListener('click', startGame);

  var viewTabs = document.getElementById('view-tabs');
  var viewBtns = viewTabs ? viewTabs.querySelectorAll('.game-tab') : [];

  function lockView(locked) {
    for (var i = 0; i < viewBtns.length; i++) {
      viewBtns[i].disabled = locked;
      viewBtns[i].title = locked ? 'Change the view between rounds' : '';
    }
  }

  function setDir(dir) {
    if (!alive) return;
    if (view === 'third') {
      if ((dir === 'left' || dir === 'right') && turnQueue.length < 2) turnQueue.push(dir);
      return;
    }
    var oldNdX = ndX, oldNdY = ndY;
    if (dir === 'up'    && dirY !== 1)  { ndX = 0;  ndY = -1; }
    if (dir === 'down'  && dirY !== -1) { ndX = 0;  ndY = 1;  }
    if (dir === 'left'  && dirX !== 1)  { ndX = -1; ndY = 0;  }
    if (dir === 'right' && dirX !== -1) { ndX = 1;  ndY = 0;  }
    if ((ndX !== oldNdX || ndY !== oldNdY) && performance.now() - lastTick >= INPUT_THRESHOLD) {
      clearInterval(tickTimer);
      tick();
      tickTimer = setInterval(tick, TICK_MS);
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowUp'    || k === 'w' || k === 'W') setDir('up');
    else if (k === 'ArrowDown'  || k === 's' || k === 'S') setDir('down');
    else if (k === 'ArrowLeft'  || k === 'a' || k === 'A') setDir('left');
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir('right');
    if (k.indexOf('Arrow') === 0) e.preventDefault();
  });

  var dpad = document.getElementById('dpad');
  if (dpad) {
    var btns = dpad.querySelectorAll('.dpad-btn');
    for (var b = 0; b < btns.length; b++) {
      (function (btn) {
        var dir = btn.getAttribute('data-dir');

        btn.addEventListener('touchstart', function (e) {
          e.preventDefault();
          btn.classList.add('pressed');
          setDir(dir);
        }, { passive: false });

        btn.addEventListener('touchend', function (e) {
          e.preventDefault();
          btn.classList.remove('pressed');
        }, { passive: false });

        btn.addEventListener('mousedown', function (e) {
          e.preventDefault();
          btn.classList.add('pressed');
          setDir(dir);
        });

        btn.addEventListener('mouseup', function () {
          btn.classList.remove('pressed');
        });
        btn.addEventListener('mouseleave', function () {
          btn.classList.remove('pressed');
        });
      })(btns[b]);
    }
  }

  var swipeX0 = null, swipeY0 = null;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    swipeX0 = t.clientX;
    swipeY0 = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (swipeX0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - swipeX0;
    var dy = t.clientY - swipeY0;
    var minSwipe = 20;
    if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 'right' : 'left');
    } else {
      setDir(dy > 0 ? 'down' : 'up');
    }
    swipeX0 = null; swipeY0 = null;
  }, { passive: true });

  window.switchMode = function (mode) {
    if (mode === gameMode) return;
    gameMode = mode;
    var tabC = document.getElementById('tab-controls');
    var tabP = document.getElementById('tab-ports');
    if (tabC) tabC.classList.toggle('active', mode === 'controls');
    if (tabP) tabP.classList.toggle('active', mode === 'ports');
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    alive = false;
    lockView(false);
    initSnake();
    sizeCanvas();
    lastTick = performance.now();
    tickProgress = 1;
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    doInitialRender();
  };

  window.switchView = function (v) {
    if (alive || v === view) return;
    view = v;
    var birds = document.getElementById('view-birds');
    var third = document.getElementById('view-third');
    if (birds) birds.classList.toggle('active', v === 'birds');
    if (third) third.classList.toggle('active', v === 'third');
    var sub = document.getElementById('game-sub');
    if (sub) sub.textContent = v === 'third'
      ? 'Eat the controls. Left and right turn the snake: arrow keys, A/D, or D-pad.'
      : 'Eat the controls. Arrow keys, WASD, or D-pad.';
    var pad = document.getElementById('dpad');
    if (pad) pad.classList.toggle('third', v === 'third');
    initSnake();
    lastTick = performance.now();
    tickProgress = 1;
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    doInitialRender();
  };

  initSnake();
  sizeCanvas();
  lastTick = performance.now();
  tickProgress = 1;
  prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });

  function doInitialRender() {
    if (view === 'third') {
      lastFrame = 0;
      drawThird(performance.now());
      return;
    }
    var s = S();
    var cw = canvas.width;
    var ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#23272e';
    ctx.fillRect(0, 0, cw, ch);
    ctx.strokeStyle = '#2a2f3a';
    ctx.lineWidth = 0.5 * s;
    for (var c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * G * s, 0); ctx.lineTo(c * G * s, ch); ctx.stroke(); }
    for (var r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * G * s); ctx.lineTo(cw, r * G * s); ctx.stroke(); }
    var bubbleR = G * 0.44;
    for (var i = snake.length - 1; i >= 0; i--) {
      var px = snake[i].x * G + G / 2;
      var py = snake[i].y * G + G / 2;
      var segAlpha = 1 - (i / snake.length) * 0.4;
      var segR = bubbleR * (i === 0 ? 1.1 : (1 - (i / snake.length) * 0.25));
      drawBubble(px, py, segR, colorForSegment(i, snake.length), glowForSegment(i, snake.length), i === 0 ? 0.8 : 0.3, segAlpha);
    }
    var fcx = foodX * G + G / 2;
    var fcy = foodY * G + G / 2;
    drawBubble(fcx, fcy, G * 0.5, '#22c55e', 'rgba(34,197,94,0.6)', 0.6, 1);
    ctx.save();
    ctx.font = 'bold ' + Math.round(9 * s) + 'px -apple-system, "Segoe UI", Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(currentCtrl[0], fcx * s, fcy * s);
    ctx.restore();
  }
  doInitialRender();
});
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
